<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        ::selection {
            background-color: rgba(6, 182, 212, 0.3);
            /* cyan-500/30 */
            color: #cffafe;
            /* cyan-100 */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #22d3ee;
            /* cyan-400 */
        }

        /* Intersection Observer Animation Classes */
        .reveal {
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.fade-up {
            transform: translateY(50px);
        }

        .reveal.fade-down {
            transform: translateY(-50px);
        }

        .reveal.fade-left {
            transform: translateX(50px);
        }

        .reveal.fade-right {
            transform: translateX(-50px);
        }

        .reveal.active {
            opacity: 1;
            transform: translate(0, 0);
        }

        /* Delays for staggered animations */
        .delay-100 {
            transition-delay: 100ms;
        }

        .delay-200 {
            transition-delay: 200ms;
        }

        .delay-300 {
            transition-delay: 300ms;
        }

        .delay-400 {
            transition-delay: 400ms;
        }

        .delay-500 {
            transition-delay: 500ms;
        }

        /* Testimonial slider transitions */
        .testimonial-slide {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
        }

        .testimonial-slide.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            position: relative;
        }
    </style>
</head>

            renderServices();
            renderPortfolio();

        function renderNavbar() {

                                <i data-lucide="menu"></i>
                            </button>
                        </div>
                    </div>

            // Mobile Menu Logic
            const btn = document.getElementById('mobile-menu-btn');

            btn.addEventListener('click', () => {
                isMenuOpen = !isMenuOpen;
                if (isMenuOpen) {
                    btn.innerHTML = '<i data-lucide="x"></i>';
                    mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
                    mobileMenu.classList.add('opacity-100', 'pointer-events-auto');
                    mobileMenu.style.transform = 'translateY(0)';

                    // Trigger animations for links
                    setTimeout(() => {
                        document.querySelectorAll('.mobile-link').forEach(link => link.classList.add('active'));
                    }, 100);
                } else {
                    closeMobileMenu();
                }
                lucide.createIcons();
            });

            document.querySelectorAll('.mobile-link').forEach(link => {
                link.addEventListener('click', closeMobileMenu);
            });

            function closeMobileMenu() {
                isMenuOpen = false;
                btn.innerHTML = '<i data-lucide="menu"></i>';
                lucide.createIcons();
                mobileMenu.classList.remove('opacity-100', 'pointer-events-auto');
                mobileMenu.classList.add('opacity-0', 'pointer-events-none');

                            <span class="relative flex items-center gap-2">

            // Parallax effect logic
            window.addEventListener('scroll', () => {
                const scrolled = window.scrollY;
                const bg = document.getElementById('parallax-bg');
                const overlay = document.getElementById('parallax-overlay');

                if (scrolled < 1000) {
                    // translateY matching Framer motion [0, 1000] -> [0, 400]
                    bg.style.transform = `translateY(${scrolled * 0.4}px)`;
                }
                if (scrolled < 500) {
                    // opacity matching Framer motion [0, 500] -> [1, 0]
                    overlay.style.opacity = Math.max(0, 1 - (scrolled / 500));
                }
            });
        }

        function renderServices() {

            `;

        function renderTestimonials() {
            const testimonialsSection = document.getElementById('testimonials-section');
            const { testimonials: data, brand } = portfolioData;

            const quoteIconSvg = `<svg viewBox="0 0 24 24" fill="currentColor" class="mx-auto w-12 h-12 text-gray-600 mb-8"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h4v10h-10z" /></svg>`;

            let html = `
                <div class="absolute bottom-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-cyan-500/50 to-transparent"></div>
                
                <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center reveal fade-up">
                    ${quoteIconSvg}
                    
                    <div class="relative h-64 md:h-48" id="testimonial-container">
            `;

            data.forEach((item, idx) => {
                html += `
                    <div class="testimonial-slide ${idx === 0 ? 'active' : ''} flex flex-col items-center justify-center h-full">
                        <p class="text-xl md:text-3xl font-light text-white italic mb-8 leading-relaxed">
                            "${item.text}"
                        </p>
                        <div>
                            <h4 class="text-lg font-bold text-white">${item.name}</h4>
                            <p class="text-sm ${brand.theme.textGradient}">${item.role}</p>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                    <div class="flex justify-center gap-2 mt-8" id="testimonial-indicators">
            `;

            data.forEach((_, idx) => {
                html += `
                    <button class="indicator-btn w-2 h-2 rounded-full transition-all duration-300 ${idx === 0 ? 'w-8 bg-cyan-400' : 'bg-gray-600'}" data-index="${idx}" aria-label="Go to testimonial ${idx + 1}"></button>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            testimonialsSection.innerHTML = html;

            // Slider Logic
            let currentIndex = 0;
            const slides = testimonialsSection.querySelectorAll('.testimonial-slide');
            const indicators = testimonialsSection.querySelectorAll('.indicator-btn');

            function goToSlide(index) {
                slides[currentIndex].classList.remove('active');
                indicators[currentIndex].classList.remove('w-8', 'bg-cyan-400');
                indicators[currentIndex].classList.add('bg-gray-600');

                currentIndex = index;

                slides[currentIndex].classList.add('active');
                indicators[currentIndex].classList.add('w-8', 'bg-cyan-400');
                indicators[currentIndex].classList.remove('bg-gray-600');
            }

            indicators.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(e.target.getAttribute('data-index'));
                    goToSlide(index);
                    resetInterval();
                });
            });

            let slideInterval = setInterval(() => {
                goToSlide((currentIndex + 1) % data.length);
            }, 5000);

            function resetInterval() {
                clearInterval(slideInterval);
                slideInterval = setInterval(() => {
                    goToSlide((currentIndex + 1) % data.length);
                }, 5000);
            }
        }

                        <p class="text-gray-500 text-xs">
                            © ${new Date().getFullYear()} ${brand.name} ${brand.subtitle}. All rights reserved.

        function initScrollAnimations() {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        // Optional: Stop observing once animated if we only want it once
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.reveal').forEach(el => {
                observer.observe(el);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderDataAll()

        });
    </script>
