<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Website</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,300&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <style>
        /* Base typography overrides */
        body {
            font-family: var(--font-body, 'Lato', sans-serif);
            background-color: var(--color-bg, #ffffff);
            color: var(--color-text, #333333);
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .heading-font {
            font-family: var(--font-heading, 'Playfair Display', serif);
        }

        /* Scroll Animations */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: opacity, transform;
        }

        .animate-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .delay-100 {
            transition-delay: 100ms;
        }

        .delay-200 {
            transition-delay: 200ms;
        }

        .delay-300 {
            transition-delay: 300ms;
        }

        /* Floating Click Effect Particles */
        .click-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: floatUpAndFade 1.5s ease-out forwards;
        }

        @keyframes floatUpAndFade {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.5);
            }

            50% {
                opacity: 0.8;
                transform: translateY(-50px) scale(1.2) rotate(15deg);
            }

            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1) rotate(-15deg);
            }
        }

        /* Ambient Background Overlay for Hero */
        .hero-overlay {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.6) 100%);
        }

        /* Dynamic Theme Classes generated via JS will be injected here */
    </style>
    <style id="dynamic-theme"></style>
</head>

<body class="antialiased selection:bg-rose-200 selection:text-rose-900">

    <header id="navbar"
        class="navbar fixed w-full top-0 z-50 transition-all duration-300 bg-white/80 backdrop-blur-md shadow-sm">
    </header>

    <main id="app-content">
        <section id="hero" class="hero relative w-full h-screen flex items-center justify-center overflow-hidden">
        </section>
        <section id="couple" class="couple py-24 px-6 md:px-12 max-w-6xl mx-auto"></section>
        <section id="story" class="story py-24 px-6 md:px-12 bg-opacity-50 theme-bg-secondary"></section>
        <section id="events" class="events py-24 px-6 md:px-12 max-w-7xl mx-auto"></section>
        <section id="gallery" class="gallery py-24 px-6 md:px-12 bg-opacity-50 theme-bg-secondary"></section>
        <section id="rsvp" class="rsvp py-24 px-6 md:px-12 max-w-4xl mx-auto"></section>
    </main>

    <footer id="footer" class="footer py-12 text-center theme-bg-primary theme-text-on-primary"></footer>

                }
            },

                timeline: [
                    {
                        year: "2019",

                ]

                items: [

                        description: "Join us for drinks and light bites to kick off the weekend.",
                        icon: "wine"
                    },
                    {

                    {

                    }

                images: [
                    "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80",
                    "https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=800&q=80",
                    "https://images.unsplash.com/photo-1606800052052-a08af7148866?auto=format&fit=crop&w=800&q=80",
                    "https://images.unsplash.com/photo-1532712938310-34cb3982ef74?auto=format&fit=crop&w=800&q=80",
                    "https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=800&q=80",

                ]

            rsvp: {
                title: "Are You Attending?",
                description: "Kindly let us know by August 1st, 2027.",
                buttonText: "Send RSVP",
                fields: [
                    { name: "name", label: "Full Name", type: "text", placeholder: "John & Jane Doe" },
                    { name: "email", label: "Email Address", type: "email", placeholder: "hello@example.com" },
                    { name: "guests", label: "Number of Guests", type: "number", placeholder: "2" },
                    { name: "dietary", label: "Dietary Requirements", type: "text", placeholder: "Vegan, allergy, etc." }
                ]
            },
            footer: {
                message: "Made with love. We can't wait to celebrate with you!",
                hashtag: "#EmmaAndJames2027"

        };

        function applyTheme() {
            const theme = websiteData.brand.theme;

            // Update CSS Variables natively
            const root = document.documentElement;
            root.style.setProperty('--color-primary', theme.primary);
            root.style.setProperty('--color-secondary', theme.secondary);
            root.style.setProperty('--color-accent', theme.accent);
            root.style.setProperty('--color-text', theme.text);
            root.style.setProperty('--color-bg', theme.bg);
            root.style.setProperty('--font-heading', theme.fontHeading);
            root.style.setProperty('--font-body', theme.fontBody);

            // Generate custom utility classes for dynamic JSON values
            const dynamicThemeCSS = `
                .theme-text-primary { color: ${theme.primary}; }
                .theme-text-accent { color: ${theme.accent}; }
                .theme-bg-primary { background-color: ${theme.primary}; }
                .theme-bg-secondary { background-color: ${theme.secondary}; }
                .theme-bg-accent { background-color: ${theme.accent}; }
                .theme-border-primary { border-color: ${theme.primary}; }
                .theme-text-on-primary { color: ${theme.bg}; }
                .hover-theme-bg-accent:hover { background-color: ${theme.accent}; color: ${theme.text} }
            `;
            document.getElementById('dynamic-theme').innerHTML = dynamicThemeCSS;
        }

        function renderNavbar() {
            const brand = websiteData.brand;
            const nav = websiteData.navigation;

            const navLinks = nav.map((link, index) => `
                <a href="${link.href}" 
                   class="navigation-item navigation-item-${index} navigation-title text-gray-700 hover:theme-text-primary transition-colors text-sm uppercase tracking-wider font-medium px-3 py-2" 
                   data-json-path="navigation[${index}].title">
                    ${link.title}
                </a>
            `).join('');

            const html = `
                <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                    <a href="#" class="flex items-center gap-2 theme-text-primary group">
                        <i data-lucide="${brand.logoIcon}" class="brand-logoIcon w-6 h-6 group-hover:scale-110 transition-transform" data-json-path="brand.logoIcon"></i>
                        <span class="brand-name heading-font text-2xl font-bold tracking-wide" data-json-path="brand.name">${brand.name}</span>
                    </a>
                    <nav class="hidden md:flex gap-6">
                        ${navLinks}
                    </nav>
                    <button class="md:hidden theme-text-primary p-2">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            `;
            document.getElementById('navbar').innerHTML = html;
        }

        function renderHero() {
            const hero = websiteData.hero;
            const html = `
                <!-- Background Image -->
                <div class="absolute inset-0 z-0">
                    <img src="${hero.image}" alt="Wedding Cover" 
                         class="hero-image w-full h-full object-cover object-center animate-[scaleIn_20s_ease-out_forwards]" 
                         style="transform: scale(1.1); animation: zoomSlow 30s infinite alternate linear;" 
                         data-json-path="hero.image">
                </div>
                <!-- Overlay -->
                <div class="absolute inset-0 z-10 hero-overlay"></div>
                
                <!-- Content -->
                <div class="relative z-20 text-center text-white px-4 max-w-4xl mx-auto animate-on-scroll">
                    <h2 class="hero-subtitle text-sm md:text-xl uppercase tracking-[0.3em] mb-6 font-light drop-shadow-md" data-json-path="hero.subtitle">
                        ${hero.subtitle}
                    </h2>
                    <h1 class="hero-title heading-font text-6xl md:text-8xl lg:text-9xl mb-8 drop-shadow-lg" data-json-path="hero.title">
                        ${hero.title}
                    </h1>
                    <div class="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-12 text-lg md:text-xl font-light mb-12">
                        <span class="hero-date flex items-center gap-2" data-json-path="hero.date"><i data-lucide="calendar" class="w-5 h-5"></i> ${hero.date}</span>
                        <span class="hidden md:block w-2 h-2 rounded-full theme-bg-primary"></span>
                        <span class="hero-location flex items-center gap-2" data-json-path="hero.location"><i data-lucide="map-pin" class="w-5 h-5"></i> ${hero.location}</span>
                    </div>
                    <a href="${hero.button.href}" 
                       class="hero-button-text inline-block px-10 py-4 theme-bg-primary hover-theme-bg-accent transition-all duration-300 text-white rounded-full uppercase tracking-wider text-sm shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:shadow-[0_0_30px_rgba(255,255,255,0.5)] transform hover:-translate-y-1" 
                       data-json-path="hero.button.text">
                        ${hero.button.text}
                    </a>
                </div>
                
                <!-- Scroll indicator -->
                <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20 animate-bounce text-white/70">
                    <i data-lucide="chevron-down" class="w-8 h-8"></i>
                </div>
                <style>
                    @keyframes zoomSlow { from { transform: scale(1); } to { transform: scale(1.15); } }
                </style>
            `;
            document.getElementById('hero').innerHTML = html;
        }

        function renderCouple() {
            const couple = websiteData.couple;

            const renderPerson = (person, delay, side) => `
                <div class="flex flex-col items-center text-center animate-on-scroll ${delay}">
                    <div class="w-64 h-64 md:w-80 md:h-80 rounded-t-full rounded-b-3xl overflow-hidden mb-8 border-4 theme-border-primary shadow-2xl relative group">
                        <img src="${person.image}" alt="${person.name}" 
                             class="couple-${side}-image w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" 
                             data-json-path="couple.${side}.image">
                        <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors duration-500"></div>
                    </div>
                    <span class="couple-${side}-role theme-text-primary uppercase tracking-widest text-sm font-semibold mb-2" data-json-path="couple.${side}.role">${person.role}</span>
                    <h3 class="couple-${side}-name heading-font text-4xl mb-4" data-json-path="couple.${side}.name">${person.name}</h3>
                    <p class="couple-${side}-bio text-gray-600 max-w-sm leading-relaxed" data-json-path="couple.${side}.bio">${person.bio}</p>
                </div>
            `;

            const html = `
                <div class="text-center mb-20 animate-on-scroll">
                    <h2 class="couple-title heading-font text-5xl md:text-6xl mb-6 theme-text-primary" data-json-path="couple.title">${couple.title}</h2>
                    <p class="couple-description text-gray-500 text-lg max-w-2xl mx-auto" data-json-path="couple.description">${couple.description}</p>
                </div>
                <div class="flex flex-col md:flex-row items-center justify-center gap-16 md:gap-24">
                    ${renderPerson(couple.bride, '', 'bride')}
                    <div class="text-5xl theme-text-primary opacity-50 heading-font animate-on-scroll delay-100">&</div>
                    ${renderPerson(couple.groom, 'delay-200', 'groom')}
                </div>
            `;
            document.getElementById('couple').innerHTML = html;
        }

        function renderStory() {
            const story = websiteData.story;

            const timelineHtml = story.timeline.map((item, index) => {
                const isEven = index % 2 === 0;
                return `
                    <div class="story-timeline-item story-timeline-item-${index} flex flex-col md:flex-row items-center justify-between w-full mb-16 relative animate-on-scroll ${index % 2 !== 0 ? 'delay-100' : ''}">
                        <!-- Connecting Line (Desktop) -->
                        <div class="hidden md:block absolute left-1/2 top-0 bottom-[-4rem] w-px theme-bg-primary/30 -translate-x-1/2 z-0"></div>
                        
                        <div class="w-full md:w-5/12 flex justify-center md:justify-${isEven ? 'end' : 'start'} z-10 ${isEven ? 'md:order-1' : 'md:order-3'} text-center md:text-${isEven ? 'right' : 'left'} px-4">
                            <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-100 hover:shadow-xl transition-shadow w-full max-w-md">
                                <span class="story-timeline-year theme-text-primary font-bold text-lg block mb-2" data-json-path="story.timeline[${index}].year">${item.year}</span>
                                <h3 class="story-timeline-title heading-font text-2xl mb-3" data-json-path="story.timeline[${index}].title">${item.title}</h3>
                                <p class="story-timeline-description text-gray-600 text-sm leading-relaxed" data-json-path="story.timeline[${index}].description">${item.description}</p>
                            </div>
                        </div>
                        
                        <!-- Icon Circle -->
                        <div class="w-16 h-16 rounded-full theme-bg-primary text-white flex items-center justify-center z-10 md:order-2 shadow-lg border-4 border-white my-6 md:my-0 shadow-[0_0_15px_rgba(183,132,96,0.3)]">
                            <i data-lucide="${item.icon}" class="story-timeline-icon w-6 h-6" data-json-path="story.timeline[${index}].icon"></i>
                        </div>
                        
                        <div class="hidden md:block w-full md:w-5/12 ${isEven ? 'md:order-3' : 'md:order-1'}"></div>
                    </div>
                `;
            }).join('');

            const html = `
                <div class="max-w-5xl mx-auto">
                    <div class="text-center mb-20 animate-on-scroll">
                        <h2 class="story-title heading-font text-5xl md:text-6xl mb-6 theme-text-primary" data-json-path="story.title">${story.title}</h2>
                        <i data-lucide="heart" class="w-8 h-8 mx-auto theme-text-primary opacity-50"></i>
                    </div>
                    <div class="relative flex flex-col items-center w-full">
                         ${timelineHtml}
                    </div>
                </div>
            `;
            document.getElementById('story').innerHTML = html;
        }

        function renderEvents() {
            const events = websiteData.events;

            const eventCardsHtml = events.items.map((event, index) => `
                <div class="events-items-item events-items-item-${index} bg-white p-10 rounded-t-full rounded-b-lg border-t-8 theme-border-primary shadow-xl text-center hover:-translate-y-2 transition-transform duration-300 animate-on-scroll delay-${(index % 3) * 100}">
                    <div class="w-20 h-20 mx-auto rounded-full theme-bg-secondary flex items-center justify-center theme-text-primary mb-6">
                        <i data-lucide="${event.icon}" class="events-items-icon w-8 h-8" data-json-path="events.items[${index}].icon"></i>
                    </div>
                    <h3 class="events-items-name heading-font text-3xl mb-4" data-json-path="events.items[${index}].name">${event.name}</h3>
                    <div class="space-y-3 text-gray-600 mb-6 text-sm">
                        <p class="events-items-date flex items-center justify-center gap-2" data-json-path="events.items[${index}].date"><i data-lucide="calendar" class="w-4 h-4"></i> ${event.date}</p>
                        <p class="events-items-time flex items-center justify-center gap-2" data-json-path="events.items[${index}].time"><i data-lucide="clock" class="w-4 h-4"></i> ${event.time}</p>
                        <p class="events-items-location flex items-center justify-center gap-2" data-json-path="events.items[${index}].location"><i data-lucide="map-pin" class="w-4 h-4"></i> ${event.location}</p>
                    </div>
                    <p class="events-items-description text-gray-500 italic" data-json-path="events.items[${index}].description">${event.description}</p>
                </div>
            `).join('');

            const html = `
                <div class="text-center mb-20 animate-on-scroll">
                    <h2 class="events-title heading-font text-5xl md:text-6xl mb-6 theme-text-primary" data-json-path="events.title">${events.title}</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                    ${eventCardsHtml}
                </div>
            `;
            document.getElementById('events').innerHTML = html;
        }

        function renderGallery() {
            const gallery = websiteData.gallery;

            const imagesHtml = gallery.images.map((img, index) => `
                <div class="gallery-images-item gallery-images-item-${index} relative overflow-hidden rounded-lg shadow-md aspect-square group animate-on-scroll delay-${(index % 4) * 100}">
                    <img src="${img}" alt="Gallery Image ${index + 1}" 
                         class="gallery-images w-full h-full object-cover group-hover:scale-110 group-hover:rotate-2 transition-all duration-700" 
                         data-json-path="gallery.images[${index}]">
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-colors duration-500 flex items-center justify-center">
                        <i data-lucide="heart" class="text-white opacity-0 group-hover:opacity-100 transform scale-0 group-hover:scale-100 transition-all duration-300 w-10 h-10 drop-shadow-md"></i>
                    </div>
                </div>
            `).join('');

            const html = `
                <div class="max-w-7xl mx-auto">
                    <div class="text-center mb-16 animate-on-scroll">
                        <h2 class="gallery-title heading-font text-5xl md:text-6xl mb-6 theme-text-primary" data-json-path="gallery.title">${gallery.title}</h2>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                        ${imagesHtml}
                    </div>
                </div>
            `;
            document.getElementById('gallery').innerHTML = html;
        }

        function renderRSVP() {
            const rsvp = websiteData.rsvp;

            const fieldsHtml = rsvp.fields.map((field, index) => `
                <div class="rsvp-fields-item rsvp-fields-item-${index} mb-6">
                    <label class="rsvp-fields-label block text-sm font-medium text-gray-700 mb-2" data-json-path="rsvp.fields[${index}].label">${field.label}</label>
                    <input type="${field.type}" name="${field.name}" placeholder="${field.placeholder}" required
                        class="rsvp-fields-placeholder w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent transition-shadow bg-white/50 backdrop-blur-sm"
                        data-json-path="rsvp.fields[${index}].placeholder">
                </div>
            `).join('');

            const html = `
                <div class="bg-white p-10 md:p-16 rounded-3xl shadow-2xl animate-on-scroll border border-gray-50 relative overflow-hidden">
                    <!-- Decorative background elements -->
                    <div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 rounded-full theme-bg-secondary opacity-50 pointer-events-none"></div>
                    <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-48 h-48 rounded-full theme-bg-accent opacity-20 pointer-events-none"></div>
                    
                    <div class="relative z-10">
                        <div class="text-center mb-12">
                            <h2 class="rsvp-title heading-font text-5xl mb-4 theme-text-primary" data-json-path="rsvp.title">${rsvp.title}</h2>
                            <p class="rsvp-description text-gray-500" data-json-path="rsvp.description">${rsvp.description}</p>
                        </div>
                        <form class="max-w-2xl mx-auto" onsubmit="event.preventDefault(); alert('RSVP mechanism would be integrated here.');">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6">
                                ${fieldsHtml}
                            </div>
                            <button type="submit" class="rsvp-buttonText w-full mt-6 py-4 rounded-full theme-bg-primary hover-theme-bg-accent text-white font-bold tracking-widest uppercase transition-colors shadow-lg hover:shadow-xl transform hover:-translate-y-1 duration-300" data-json-path="rsvp.buttonText">
                                ${rsvp.buttonText}
                            </button>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('rsvp').innerHTML = html;
        }

        function renderFooter() {
            const footer = websiteData.footer;
            const brand = websiteData.brand;

            const html = `
                <div class="max-w-4xl mx-auto px-6 flex flex-col items-center animate-on-scroll">
                    <i data-lucide="${brand.logoIcon}" class="brand-logoIcon w-10 h-10 mb-6 opacity-80" data-json-path="brand.logoIcon"></i>
                    <h2 class="brand-name heading-font text-4xl mb-6" data-json-path="brand.name">${brand.name}</h2>
                    <p class="footer-message text-lg opacity-80 mb-4" data-json-path="footer.message">${footer.message}</p>
                    <p class="footer-hashtag font-bold tracking-widest uppercase text-sm" data-json-path="footer.hashtag">${footer.hashtag}</p>
                    <div class="mt-12 text-sm opacity-60">
                        &copy; ${new Date().getFullYear()} <span data-json-path="brand.name" class="brand-name">${brand.name}</span>. All rights reserved.
                    </div>
                </div>
            `;
            document.getElementById('footer').innerHTML = html;
        }

        let audioInitialized = false;
        let synth = null;

        // Pentatonic scale notes for a magical, harmonious sound
        const notes = ["C4", "D4", "E4", "G4", "A4", "C5", "D5", "E5"];

        function initAudioAndEffects() {
            // Prevent multiple initializations
            if (window._effectsInitialized) return;
            window._effectsInitialized = true;

            document.addEventListener('click', async (e) => {
                // Initialize audio context on first user interaction
                if (!audioInitialized) {
                    await Tone.start();
                    // Create a soft synth sound
                    synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "sine" },
                        envelope: {
                            attack: 0.05,
                            decay: 0.3,
                            sustain: 0.4,
                            release: 1.5
                        },
                        volume: -15
                    }).toDestination();

                    // Add slight reverb/delay for dreaminess
                    const reverb = new Tone.Reverb(2.5).toDestination();
                    synth.connect(reverb);

                    audioInitialized = true;
                }

                // Play a random sweet note
                if (synth && audioInitialized) {
                    const randomNote = notes[Math.floor(Math.random() * notes.length)];
                    synth.triggerAttackRelease(randomNote, "8n");
                }

                // Visual click effect (Floating Heart)
                createClickParticle(e.clientX, e.clientY);
            });
        }

        function createClickParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'click-particle text-[var(--color-primary)]';

            // Randomize size slightly
            const size = Math.random() * 10 + 15; // 15px to 25px
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;

            // Render an SVG heart natively
            particle.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;

            // Position exactly at click center
            particle.style.left = `${x - size / 2}px`;
            particle.style.top = `${y - size / 2}px`;

            document.body.appendChild(particle);

            // Clean up DOM after animation finishes (1.5s as per CSS)
            setTimeout(() => {
                particle.remove();
            }, 1500);
        }

        function initScrollAnimations() {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        // Optional: stop observing once animated
                        // observer.unobserve(entry.target); 
                    }
                });
            }, observerOptions);

            const animatedElements = document.querySelectorAll('.animate-on-scroll');
            animatedElements.forEach(el => observer.observe(el));
        }

        function initializeComponents() {
            // 1. Initialize icons from JSON data
            lucide.createIcons();

            // 2. Setup visual scroll observers
            initScrollAnimations();

            // 3. Setup click effects & sound (awaits user interaction)
            initAudioAndEffects();
        }

        function renderDataAll(data) {
            if (data) {
                websiteData = data;
            }

            // Apply theming first
            applyTheme();

            // Render all sections
            renderNavbar();
            renderHero();
            renderCouple();
            renderStory();
            renderEvents();
            renderGallery();
            renderRSVP();
            renderFooter();

            // Re-initialize dynamic behaviors
            initializeComponents();
        }

        // Listen for external builder updates
        window.addEventListener("message", function (event) {
            if (event.data && event.data.type === "UPDATE_DATA") {
                renderDataAll(event.data.data);
            }
        });

        // Initial Render on Load
        document.addEventListener("DOMContentLoaded", function () {
            renderDataAll();
        });

        document.addEventListener('click', function (event) {
            console.log(event.target, event.target.dataset.jsonPath);
        });

    </script>
</body>

</html>
