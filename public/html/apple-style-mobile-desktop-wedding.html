
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Responsive Apple Style Wedding Invite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#faf7f3;overflow-x:hidden}
.hero{height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f8ece2,#fff)}
.hero h1{font:700 clamp(2.8rem,8vw,5rem) "Cormorant Garamond",serif;text-align:center}
.wrap{height:400vh;position:relative}
.pin{position:sticky;top:0;height:100vh;background:#fff;overflow:hidden}
.stage{position:relative;width:100%;height:100%}
.card{position:absolute;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.card img{width:100%;height:100%;object-fit:cover}
.c1{left:50%;top:50%;transform:translate(-50%,-50%);width:100vw;height:100vh;z-index:5}
.c2,.c3,.c4,.c5{width:22vw;height:28vh}
.c2{left:-35vw;top:10%}
.c3{right:-35vw;top:10%}
.c4{left:8%;bottom:-40vh}
.c5{right:8%;bottom:-40vh}
@media(max-width:768px){
.wrap{height:420vh}
.c2,.c3,.c4,.c5{width:28vw;height:32vh}
.c2{left:-40vw;top:4%}
.c3{right:-40vw;top:20%}
.c4{left:-40vw;bottom:20%}
.c5{right:-40vw;bottom:4%}
}
.content{padding:100px 10vw;line-height:1.8}
</style>
</head>
<body>
<section class="hero"><div><h1>Arjun ♥ Meera</h1><p style="text-align:center">12 December 2027</p></div></section>
<section class="wrap"><div class="pin"><div class="stage">
<div class="card c1"><img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1800&q=80"></div>
<div class="card c2"><img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=80"></div>
<div class="card c3"><img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1200&q=80"></div>
<div class="card c4"><img src="https://images.unsplash.com/photo-1529636798458-92182e662485?auto=format&fit=crop&w=1200&q=80"></div>
<div class="card c5"><img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=80"></div>
</div></div></section>
<div class="content"><h2>You're Invited</h2><p>The mobile version uses the same animation timeline as desktop with responsive image sizing and positioning rather than a different stacked layout.</p></div>
<script>
gsap.registerPlugin(ScrollTrigger);
const mobile=matchMedia("(max-width:768px)").matches;
const tl=gsap.timeline({
scrollTrigger:{trigger:".wrap",start:"top top",end:"+=3000",scrub:1,pin:".pin"}
});
if(mobile){
tl.to(".c1",{width:"36vw",height:"72vh",duration:2,ease:"none"})
.to(".c2",{left:"2%",duration:1.3,ease:"none"},"<0.3")
.to(".c3",{right:"2%",duration:1.3,ease:"none"},"<")
.to(".c4",{left:"2%",duration:1.3,ease:"none"},"+=0.2")
.to(".c5",{right:"2%",duration:1.3,ease:"none"},"<");
}else{
tl.to(".c1",{width:"30vw",height:"42vh",duration:2,ease:"none"})
.to(".c2",{left:"8%",duration:1.3,ease:"none"},"<0.3")
.to(".c3",{right:"8%",duration:1.3,ease:"none"},"<")
.to(".c4",{bottom:"12%",duration:1.3,ease:"none"},"+=0.2")
.to(".c5",{bottom:"12%",duration:1.3,ease:"none"},"<");
}
</script>
</body>
</html>
