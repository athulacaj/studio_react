<!DOCTYPE html>
<html class="scroll-smooth" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title id="page-title">Wedding Celebration</title>

    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap"
        rel="stylesheet" id="font-links" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <!-- Dynamic Tailwind Configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "var(--theme-primary)",
                        secondary: "var(--theme-secondary)",
                        background: "var(--theme-background)",
                        "surface-container-low": "var(--theme-surface-container-low)",
                        "surface-container-lowest": "var(--theme-surface-container-lowest)",
                        "surface-container-high": "var(--theme-surface-container-high)",
                        "on-surface-variant": "var(--theme-on-surface-variant)",
                        "secondary-container": "var(--theme-secondary-container)",
                        "outline-variant": "var(--theme-outline-variant)",
                    },
                    spacing: {
                        "gutter": "24px"
                    },
                    fontFamily: {
                        "headline": ["var(--theme-font-headline)"],
                        "body": ["var(--theme-font-body)"]
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Styles & Utilities */
        :root {
            --luxury-duration: 1s;
            --luxury-ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .maps-iframe {
            filter: grayscale(100%) contrast(1.1) opacity(0.8);
            transition: filter 0.5s ease;
        }

        .maps-iframe:hover {
            filter: grayscale(30%) contrast(1) opacity(1);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            inset: 0;
            background-color: var(--theme-background, #faf9f6);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s cubic-bezier(0.8, 0, 0.2, 1), visibility 1.2s;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Premium Animations */
        @keyframes slowZoom {
            0% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1.10);
            }
        }

        .animate-slow-zoom {
            animation: slowZoom 30s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes revealLine {
            from {
                transform: scaleX(0);
                opacity: 0;
            }

            to {
                transform: scaleX(1);
                opacity: 1;
            }
        }

        .hero-text-anim {
            opacity: 0;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 {
            animation-delay: 0.2s;
        }

        .delay-2 {
            animation-delay: 0.45s;
        }

        .delay-3 {
            animation-delay: 0.7s;
        }

        .delay-4 {
            animation-delay: 0.95s;
        }

        .delay-line {
            animation: revealLine 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 1.3s;
            transform-origin: center;
            opacity: 0;
        }

        .fade-in-section {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity var(--luxury-duration) var(--luxury-ease), transform var(--luxury-duration) var(--luxury-ease);
            will-change: opacity, transform;
        }

        .fade-in-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item {
            overflow: hidden;
        }

        .gallery-item img {
            transition: transform 1.2s var(--luxury-ease), filter .8s ease;
            will-change: transform;
        }

        .gallery-item:hover img {
            transform: scale(1.03);
            filter: brightness(1.05);
        }

        @keyframes gentleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(6px);
            }
        }

        .scroll-indicator {
            animation: gentleFloat 3s ease-in-out infinite;
        }

        .nav-scrolled {
            background-color: color-mix(in srgb, var(--theme-background) 95%, transparent) !important;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(12px);
            border-bottom-color: color-mix(in srgb, var(--theme-outline-variant) 50%, transparent) !important;
        }
    </style>
</head>

<body class="bg-background text-on-background font-body selection:bg-secondary-container">

    <!-- Preloader -->
    <div id="loader">
        <div class="font-headline text-primary tracking-[0.3em] uppercase animate-pulse">
            Loading...
        </div>
    </div>

    <!-- Render Targets -->
    <nav id="navbar"
        class="fixed top-0 w-full z-50 bg-transparent border-b border-transparent transition-[background-color,box-shadow,backdrop-filter] duration-[800ms] flex justify-between items-center px-gutter h-20 md:h-24">
    </nav>
    <header id="hero" class="relative h-screen w-full flex items-center justify-center overflow-hidden"></header>

    <main class="max-w-[1120px] mx-auto px-gutter py-24 md:py-32 space-y-32 md:space-y-48">
        <section id="invitation" class="fade-in-section text-center max-w-3xl mx-auto"></section>
        <section id="details" class="fade-in-section"></section>
        <section id="location" class="fade-in-section space-y-12"></section>
        <section id="gallery" class="fade-in-section"></section>
        <section id="rsvp"
            class="fade-in-section max-w-2xl mx-auto text-center bg-surface-container-low p-12 md:p-16 rounded-2xl border border-outline-variant/20 relative overflow-hidden">
        </section>
    </main>

    <footer id="footer" class="bg-surface-container-low py-20 px-gutter text-center border-t border-outline-variant/20">
    </footer>

    <nav id="mobile-nav"
        class="md:hidden fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-lg flex justify-around items-center px-4 py-4 pb-safe border-t border-outline-variant/20 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
    </nav>

    <!-- Core Javascript Data & Renderer -->
    <script>

        let websiteData = {
            brand: {

                names: {
                    first: "Alan",

                },

                theme: {
                    primary: "#182319",
                    secondary: "#685d4a",
                    background: "#faf9f6",
                    surfaceContainerLow: "#f4f3f1",
                    surfaceContainerLowest: "#ffffff",
                    surfaceContainerHigh: "#e9e8e5",
                    onSurfaceVariant: "#444843",
                    secondaryContainer: "#eddec5",
                    outlineVariant: "#c4c8c1",
                    fontHeadline: "'Playfair Display', serif",
                    fontBody: "'Plus Jakarta Sans', sans-serif"
                }
            },

                { title: "GALLERY", href: "#gallery", icon: "photo_library" },
                { title: "RSVP", href: "#rsvp", icon: "mail" }
            ],
            hero: {
                image: "https://images.unsplash.com/photo-1519741497674-611481863552?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80",
                subtitle: "THE WEDDING OF",
                date: "Saturday, June 21, 2026",
                scrollIcon: "expand_more"
            },
            invitation: {
                image: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
                subtitle: "SAVE THE DATE",
                title: "We invite you to celebrate our union",
                description: "In the presence of family and friends, join us as we exchange vows and begin our new chapter together surrounded by the breathtaking rolling hills of the countryside."
            },
            detailsSection: {
                subtitle: "THE CELEBRATION",
                title: "When & Where",
                events: [
                    {
                        type: "ceremony",
                        time: "4:00 PM",
                        locationName: "The Glass House Estate",
                        locationAddress: "123 Orchard Lane, Valley",
                        locationUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d100939.98555098464!2d-122.50764!3d37.757815!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80859a6d00690021%3A0x4a501367f076adff!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1655000000000!5m2!1sen!2sus",

                        locationAddress: "125 Orchard Lane, Valley",
                        locationUrl: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.835434509374!2d-122.4194155!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c6c8f4459%3A0xb10ed6d9b5050f14!2sCivic%20Center%2C%20San%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1655000000001!5m2!1sen!2sus",
                        locationDesc: "Following the ceremony, join us for cocktails, dinner, and dancing under the stars. Valet parking will be available at the main entrance."
                    }
                ]
            },
            gallerySection: {
                subtitle: "GALLERY",
                title: "Our Moments",
                images: [
                    { src: "https://images.unsplash.com/photo-1520854221256-17451cc331bf?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80" },
                    { src: "https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80" },
                    { src: "https://images.unsplash.com/photo-1606800052052-a08af7148866?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80" },
                    { src: "https://images.unsplash.com/photo-1583939000240-690d568c0725?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80" },
                    { src: "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80" },
                    { src: "https://images.unsplash.com/photo-1607190072270-128b1ba74a48?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80" }
                ]
            },
            rsvpSection: {
                subtitle: "ATTENDANCE",
                title: "Join the Celebration",
                buttonText: "SEND RSVP"
            },
            footer: {
                message: "We can't wait to celebrate with you.",
                icon: "favorite"
            }
        };

        // 2. RENDERING FUNCTIONS
        function renderTheme() {
            const root = document.documentElement;
            const theme = websiteData.brand.theme;

            root.style.setProperty("--theme-primary", theme.primary);
            root.style.setProperty("--theme-secondary", theme.secondary);
            root.style.setProperty("--theme-background", theme.background);
            root.style.setProperty("--theme-surface-container-low", theme.surfaceContainerLow);
            root.style.setProperty("--theme-surface-container-lowest", theme.surfaceContainerLowest);
            root.style.setProperty("--theme-surface-container-high", theme.surfaceContainerHigh);
            root.style.setProperty("--theme-on-surface-variant", theme.onSurfaceVariant);
            root.style.setProperty("--theme-secondary-container", theme.secondaryContainer);
            root.style.setProperty("--theme-outline-variant", theme.outlineVariant);
            root.style.setProperty("--theme-font-headline", theme.fontHeadline);
            root.style.setProperty("--theme-font-body", theme.fontBody);

            document.getElementById("page-title").innerText = `${websiteData.brand.names.first} & ${websiteData.brand.names.second}`;
        }

        function renderNavbar() {
            document.getElementById("navbar").innerHTML = `
                <div class="flex items-center gap-4">
                    <button aria-label="Menu" class="text-white nav-item hover:text-secondary-container transition-colors duration-300">
                        <span class="material-symbols-outlined text-2xl">menu</span>
                    </button>
                </div>
                <div class="brand-logo font-headline text-2xl md:text-3xl text-white nav-item tracking-widest uppercase transition-colors duration-300" data-json-path="brand.logo">
                    ${websiteData.brand.logo}
                </div>
                <div class="flex items-center gap-4">
                    <button aria-label="Favorite" class="text-white nav-item hover:text-secondary-container transition-colors duration-300">
                        <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">favorite</span>
                    </button>
                </div>
            `;

            document.getElementById("mobile-nav").innerHTML = websiteData.navigation.map((item, index) => `
                <a class="navigation-item navigation-item-${index} flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-all active:scale-95" data-json-path="navigation[${index}]" href="${item.href}">
                    <span class="navigation-icon navigation-item-${index}-icon material-symbols-outlined text-xl" data-json-path="navigation[${index}].icon">${item.icon}</span>
                    <span class="navigation-title navigation-item-${index}-title font-body text-[9px] mt-1 font-bold tracking-wider uppercase" data-json-path="navigation[${index}].title">${item.title}</span>
                </a>
            `).join('');
        }

        function renderHero() {
            const hero = websiteData.hero;
            const names = websiteData.brand.names;

            document.getElementById("hero").innerHTML = `
                <div class="absolute inset-0 z-0 bg-primary">
                    <div id="mainImage" class="hero-image w-full h-full bg-cover bg-center animate-slow-zoom" style="will-change: transform; background-image: url('${hero.image}');" data-json-path="hero.image">
                        <div class="absolute inset-0 bg-gradient-to-b from-primary/40 via-primary/20 to-primary/60 mix-blend-multiply"></div>
                    </div>
                </div>
                <div class="relative z-10 text-center text-white px-gutter flex flex-col items-center">
                    <p class="hero-subtitle font-body font-bold text-xs md:text-sm tracking-[0.4em] mb-6 text-surface-container-lowest hero-text-anim delay-1" data-json-path="hero.subtitle">
                        ${hero.subtitle}
                    </p>
                    <h1 class="font-headline text-5xl md:text-7xl lg:text-8xl mb-2 font-light tracking-tight">
                        <span class="brand-names-first inline-block hero-text-anim delay-2" data-json-path="brand.names.first">${names.first}</span>
                        <span class="inline-block mx-2 hero-text-anim delay-2 text-secondary-container">&</span>
                        <span class="brand-names-second inline-block hero-text-anim delay-3" data-json-path="brand.names.second">${names.second}</span>
                    </h1>
                    <div class="w-16 h-[1px] bg-white/70 mx-auto mt-8 mb-8 delay-line"></div>
                    <p class="hero-date font-headline text-xl md:text-2xl italic tracking-wide hero-text-anim delay-4 text-surface-container-low" data-json-path="hero.date">
                        ${hero.date}
                    </p>
                </div>
                <div class="absolute bottom-12 left-1/2 -translate-x-1/2 z-10 hero-text-anim delay-4">
                    <span class="hero-scrollIcon material-symbols-outlined text-white/70 text-3xl scroll-indicator" data-json-path="hero.scrollIcon">${hero.scrollIcon}</span>
                </div>
            `;
        }

        function renderInvitation() {
            const invite = websiteData.invitation;
            document.getElementById("invitation").innerHTML = `
                <div class="flex flex-col items-center">
                    <div class="relative mb-12 group cursor-pointer">
                        <div class="absolute inset-0 bg-secondary/20 rounded-full scale-110 opacity-0 group-hover:opacity-100 transition-all duration-700 blur-xl"></div>
                        <img alt="Invitation visual" class="invitation-image relative w-36 h-36 md:w-52 md:h-52 object-cover rounded-full border border-outline-variant/30 p-2 grayscale hover:grayscale-0 transition-all duration-1000 z-10" data-json-path="invitation.image" src="${invite.image}" />
                    </div>
                    <p class="invitation-subtitle font-body font-bold text-xs md:text-sm text-secondary tracking-[0.3em] mb-6 uppercase" data-json-path="invitation.subtitle">${invite.subtitle}</p>
                    <h2 class="invitation-title font-headline text-3xl md:text-5xl text-primary mb-8 leading-tight italic" data-json-path="invitation.title">${invite.title}</h2>
                    <p class="invitation-description font-body text-lg md:text-xl text-on-surface-variant max-w-2xl mx-auto leading-relaxed font-light" data-json-path="invitation.description">${invite.description}</p>
                </div>
            `;
        }

        function renderDetails() {
            const ds = websiteData.detailsSection;
            document.getElementById("details").innerHTML = `
                <div class="text-center mb-16">
                    <p class="detailsSection-subtitle font-body font-bold text-xs text-secondary tracking-[0.3em] mb-4 uppercase" data-json-path="detailsSection.subtitle">${ds.subtitle}</p>
                    <h2 class="detailsSection-title font-headline text-3xl md:text-4xl text-primary" data-json-path="detailsSection.title">${ds.title}</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    ${ds.events.map((event, index) => `
                        <a href="#location_${index}" class="detailsSection-events detailsSection-events-${index} block group" data-json-path="detailsSection.events[${index}]">
                            <div class="relative bg-surface-container-lowest border border-outline-variant/20 rounded-2xl p-10 flex flex-col items-center text-center group-hover:border-secondary/50 group-hover:shadow-[0_8px_30px_rgb(0,0,0,0.04)] group-hover:-translate-y-0.5 transition-[background-color,box-shadow,backdrop-filter] duration-[800ms] cursor-pointer overflow-hidden h-full">
                                <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-bl from-secondary/10 to-transparent rounded-bl-full -mr-10 -mt-10 transition-transform duration-500 group-hover:scale-150"></div>
                                <span class="absolute top-6 right-6 opacity-0 group-hover:opacity-100 group-hover:translate-x-0 -translate-x-4 transition-all duration-300 text-secondary text-xl material-symbols-outlined">arrow_forward</span>
                                <p class="detailsSection-events-type detailsSection-events-${index}-type font-body font-bold text-xs text-secondary tracking-[0.2em] mb-3 uppercase" data-json-path="detailsSection.events[${index}].type">${event.type}</p>
                                <h3 class="detailsSection-events-time detailsSection-events-${index}-time font-headline text-3xl text-primary mb-4" data-json-path="detailsSection.events[${index}].time">${event.time}</h3>
                                <div class="w-8 h-[1px] bg-outline-variant/50 mb-4"></div>
                                <p class="detailsSection-events-locationName detailsSection-events-${index}-locationName font-body text-on-surface-variant font-light px-4" data-json-path="detailsSection.events[${index}].locationName">${event.locationName}</p>
                            </div>
                        </a>
                    `).join('')}
                </div>
            `;
        }

        function renderLocations() {
            const events = websiteData.detailsSection.events;
            document.getElementById("location").innerHTML = events.map((event, index) => `
                <div id="location_${index}" class="detailsSection-events detailsSection-events-${index} bg-surface-container-lowest border border-outline-variant/20 rounded-3xl overflow-hidden shadow-sm flex flex-col md:flex-row hover:shadow-md transition-shadow duration-500" data-json-path="detailsSection.events[${index}]">
                    <div class="md:w-1/2 h-[350px] md:h-auto bg-surface-container-high relative overflow-hidden group">
                        <iframe class="detailsSection-events-locationUrl detailsSection-events-${index}-locationUrl maps-iframe w-full h-full absolute inset-0" data-json-path="detailsSection.events[${index}].locationUrl" src="${event.locationUrl}" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                    </div>
                    <div class="md:w-1/2 p-10 md:p-16 flex flex-col justify-center relative">
                        <div class="absolute top-0 left-0 w-2 h-full bg-secondary/20"></div>
                        <p class="detailsSection-events-type detailsSection-events-${index}-type font-body font-bold text-xs text-secondary tracking-[0.2em] mb-4 uppercase" data-json-path="detailsSection.events[${index}].type">${event.type} LOCATION</p>
                        <h2 class="detailsSection-events-locationName detailsSection-events-${index}-locationName font-headline text-3xl md:text-4xl text-primary mb-6" data-json-path="detailsSection.events[${index}].locationName">${event.locationName.split('<br')[0]}</h2>
                        <p class="detailsSection-events-locationAddress detailsSection-events-${index}-locationAddress font-body text-secondary text-sm mb-4" data-json-path="detailsSection.events[${index}].locationAddress">${event.locationAddress}</p>
                        <p class="detailsSection-events-locationDesc detailsSection-events-${index}-locationDesc font-body text-on-surface-variant leading-relaxed font-light mb-8" data-json-path="detailsSection.events[${index}].locationDesc">${event.locationDesc}</p>
                        <a href="${event.locationUrl}" target="_blank" class="detailsSection-events-locationUrl detailsSection-events-${index}-locationUrl inline-flex items-center gap-2 text-sm font-body font-bold tracking-widest text-secondary hover:text-primary transition-colors w-fit group" data-json-path="detailsSection.events[${index}].locationUrl">
                            OPEN IN MAPS 
                            <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_right_alt</span>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function renderGallery() {
            const gs = websiteData.gallerySection;
            document.getElementById("gallery").innerHTML = `
                <div class="text-center mb-16">
                    <p class="gallerySection-subtitle font-body font-bold text-xs text-secondary tracking-[0.3em] mb-4 uppercase" data-json-path="gallerySection.subtitle">${gs.subtitle}</p>
                    <h2 class="gallerySection-title font-headline text-3xl md:text-4xl text-primary" data-json-path="gallerySection.title">${gs.title}</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${gs.images.map((img, index) => {
                let delayClass = index % 3 === 0 ? '' : (index % 3 === 1 ? 'delay-[100ms]' : 'delay-[200ms]');
                return `
                        <div class="gallerySection-images gallerySection-images-${index} gallery-item rounded-2xl shadow-sm ${delayClass}" data-json-path="gallerySection.images[${index}]">
                            <img alt="Gallery photo ${index + 1}" class="gallerySection-images-src gallerySection-images-${index}-src w-full h-[300px] md:h-[450px] object-cover" data-json-path="gallerySection.images[${index}].src" src="${img.src}" loading="lazy" />
                        </div>
                        `;
            }).join('')}
                </div>
            `;
        }

        function renderRsvp() {
            const rsvp = websiteData.rsvpSection;
            document.getElementById("rsvp").innerHTML = `
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-secondary to-transparent opacity-50"></div>
                <p class="rsvpSection-subtitle font-body font-bold text-xs text-secondary tracking-[0.3em] mb-4 uppercase" data-json-path="rsvpSection.subtitle">${rsvp.subtitle}</p>
                <h2 class="rsvpSection-title font-headline text-3xl md:text-4xl text-primary mb-8" data-json-path="rsvpSection.title">${rsvp.title}</h2>
                <form id="rsvpForm" class="flex flex-col gap-6 text-left">
                    <div>
                        <label class="block font-body text-sm text-on-surface-variant mb-2">Full Name</label>
                        <input type="text" class="w-full bg-background border-outline-variant/30 border rounded-lg px-4 py-3 focus:outline-none focus:ring-1 focus:ring-secondary focus:border-secondary transition-all" placeholder="Enter your name" required>
                    </div>
                    <div>
                        <label class="block font-body text-sm text-on-surface-variant mb-2">Will you be attending?</label>
                        <select class="w-full bg-background border-outline-variant/30 border rounded-lg px-4 py-3 focus:outline-none focus:ring-1 focus:ring-secondary focus:border-secondary transition-all" required>
                            <option value="" disabled selected>Please select...</option>
                            <option value="yes">Joyfully Accept</option>
                            <option value="no">Regretfully Decline</option>
                        </select>
                    </div>
                    <button type="submit" class="rsvpSection-buttonText mt-4 bg-primary text-white font-body font-bold tracking-[0.2em] py-4 rounded-lg hover:bg-secondary transition-colors duration-300 w-full flex justify-center items-center gap-2 uppercase" data-json-path="rsvpSection.buttonText">
                        <span>${rsvp.buttonText}</span>
                    </button>
                </form>
            `;
        }

        function renderFooter() {
            const footer = websiteData.footer;
            const brand = websiteData.brand;
            document.getElementById("footer").innerHTML = `
                <h2 class="brand-logo font-headline text-3xl text-primary mb-6 tracking-widest uppercase" data-json-path="brand.logo">${brand.logo}</h2>
                <p class="footer-message font-body text-on-surface-variant mb-12 font-light" data-json-path="footer.message">${footer.message}</p>
                <div class="flex justify-center gap-6 text-secondary/60">
                    <span class="footer-icon material-symbols-outlined text-sm" data-json-path="footer.icon">${footer.icon}</span>
                </div>
                <p class="brand-copyright mt-12 font-body font-bold text-[10px] text-outline-variant tracking-widest uppercase" data-json-path="brand.copyright">${brand.copyright}</p>
            `;
        }

        // 3. MASTER RENDERER
        function renderDataAll(data) {
            if (data) {
                websiteData = data;
            }

            renderTheme();
            renderNavbar();
            renderHero();
            renderInvitation();
            renderDetails();
            renderLocations();
            renderGallery();
            renderRsvp();
            renderFooter();

            initializeComponents();
        }

        // 4. BEHAVIOR & INTERACTIVITY
        function initializeComponents() {
            initScrollAnimations();
            initNavbarScroll();
            initRsvpForm();
            hideLoader();
        }

        function hideLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                setTimeout(() => loader.classList.add('hidden'), 300);
            }
        }

        function initScrollAnimations() {
            const observerOptions = { threshold: 0.15, rootMargin: "0px 0px -50px 0px" };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.fade-in-section').forEach(section => observer.observe(section));
        }

        function initNavbarScroll() {
            const navbar = document.getElementById('navbar');
            const navItems = navbar.querySelectorAll('.nav-item');
            const heroImage = document.getElementById('mainImage');

            // Clean up old listener if re-rendering
            window.onscroll = () => {
                const scroll = window.scrollY;
                if (scroll > 100) {
                    navbar.classList.add('nav-scrolled');
                    navItems.forEach(item => { item.classList.remove('text-white'); item.classList.add('text-primary'); });
                } else {
                    navbar.classList.remove('nav-scrolled');
                    navItems.forEach(item => { item.classList.add('text-white'); item.classList.remove('text-primary'); });
                }

                if (heroImage && scroll < window.innerHeight) {
                    heroImage.style.transform = `translateY(${scroll * 0.3}px) scale(1.1)`;
                }
            };
        }

        function initRsvpForm() {
            const form = document.getElementById('rsvpForm');
            if (form) {
                form.onsubmit = (e) => {
                    e.preventDefault();
                    const btn = form.querySelector('button');
                    const btnText = btn.querySelector('span');
                    const originalText = btnText.innerText;

                    btnText.innerText = 'SENDING...';
                    btn.classList.add('opacity-80', 'cursor-not-allowed');
                    btn.disabled = true;

                    setTimeout(() => {
                        btnText.innerText = 'RSVP RECEIVED!';
                        btn.classList.replace('bg-primary', 'bg-secondary');
                        form.reset();

                        setTimeout(() => {
                            btnText.innerText = originalText;
                            btn.classList.replace('bg-secondary', 'bg-primary');
                            btn.classList.remove('opacity-80', 'cursor-not-allowed');
                            btn.disabled = false;
                        }, 4000);
                    }, 1500);
                };
            }
        }

        // 5. EVENT LISTENERS
        document.addEventListener("DOMContentLoaded", function () {
            renderDataAll();
        });
        let parentOrigin = null;


        window.addEventListener("message", function (event) {
            parentOrigin = event.origin;
            console.log("parentOrigin ", parentOrigin)
            if (event.data && event.data.type === "UPDATE_DATA") {
                renderDataAll(event.data.data);
            }
        });
        document.addEventListener("click", function (event) {
            console.log("clicked")
            console.log(event.target)
            if (!parentOrigin) return;

            window.parent.postMessage({
                type: "ELEMENT_CLICKED",
                jsonPath: event.target.dataset.jsonPath
            }, parentOrigin);
        });

    </script>
</body>

</html>
