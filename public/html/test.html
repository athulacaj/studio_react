<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&family=Sacramento&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #aa820a;
            --primary-light: #f6e5aa;
            --champagne: #fdfbf7;
            --champagne-dark: #f7f2ea;
            --text: #333333;
            --muted: #6b6b6b;
            --blush: #f9d2d2;
            --white: #ffffff;
            --serif: "Cormorant Garamond", serif;
            --sans: "Montserrat", sans-serif;
            --script: "Sacramento", cursive;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--champagne);
            color: var(--text);
            font-family: var(--sans);
            overflow-x: hidden;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        a {
            color: inherit;
        }

        #parent {
            min-height: 100vh;
        }

        .page-shell {
            position: relative;
            overflow: hidden;
        }

        .canvas-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 60;
        }

        .music-button,
        .nav-shell {
            background: rgba(255, 255, 255, .9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, .3);
            box-shadow: 0 8px 28px rgba(0, 0, 0, .08);
        }

        .music-button {
            display: flex;
            align-items: center;
            gap: 9px;
            border-radius: 999px;
            padding: 10px 16px;
            color: var(--primary-dark);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: .12em;
            font-size: 11px;
            transition: .3s ease;
        }

        .music-button:hover {
            background: var(--primary);
            color: var(--white);
        }

        .nav-shell {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 11px 24px;
            border-radius: 999px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .16em;
        }

        .nav-link {
            text-decoration: none;
            transition: .25s ease;
        }

        .nav-link:hover {
            color: var(--primary-dark);
        }

        .nav-link.emphasis {
            background: var(--primary);
            color: var(--white);
            padding: 7px 15px;
            border-radius: 999px;
        }

        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 90px 16px 48px;
            background-size: cover;
            background-position: center;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(253, 251, 247, .75), rgba(253, 251, 247, .86));
        }

        .hero-card {
            position: relative;
            z-index: 20;
            width: min(850px, 100%);
            text-align: center;
            padding: 38px;
            border-radius: 24px;
            background: rgba(253, 251, 247, .88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, .4);
            box-shadow: 0 22px 70px rgba(0, 0, 0, .15);
            animation: pulseGlow 4s infinite ease-in-out;
        }

        .eyebrow {
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: .3em;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary-dark);
            border-bottom: 1px solid var(--primary-light);
            padding-bottom: 5px;
        }

        .script {
            font-family: var(--script);
            color: var(--primary-dark);
        }

        .serif {
            font-family: var(--serif);
        }

        .hero-names {
            margin: 12px 0;
            font: 300 clamp(48px, 8vw, 88px)/.95 var(--serif);
            letter-spacing: -.03em;
            color: #1f1f1f;
        }

        .hero-connector {
            font: normal clamp(38px, 6vw, 72px) var(--script);
            color: var(--primary);
            display: inline-block;
            margin: 0 10px;
        }

        .hero-description {
            margin: 18px auto;
            max-width: 650px;
            font: italic 300 clamp(18px, 2.5vw, 27px)/1.3 var(--serif);
            color: var(--muted);
        }

        .date-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 24px 0;
            padding: 17px 0;
            border-top: 1px solid var(--primary-light);
            border-bottom: 1px solid var(--primary-light);
            text-transform: uppercase;
            letter-spacing: .16em;
            font-size: 12px;
        }

        .date-row .date {
            font: 600 24px var(--serif);
            letter-spacing: normal;
            text-transform: none;
            color: #222;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
        }

        .countdown-label {
            margin: 0 0 12px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .2em;
            color: var(--muted);
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 520px;
            margin: auto;
        }

        .count-card {
            background: rgba(255, 255, 255, .92);
            padding: 13px 8px;
            border: 1px solid var(--primary-light);
            border-radius: 10px;
        }

        .count-number {
            display: block;
            font: 700 clamp(28px, 5vw, 44px) var(--serif);
            color: var(--primary-dark);
        }

        .count-label {
            display: block;
            margin-top: 2px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 13px 25px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: .14em;
            font-size: 11px;
            font-weight: 600;
            transition: .25s ease;
            cursor: pointer;
            border: 1px solid var(--primary-light);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--champagne-dark);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--primary-dark);
            text-decoration: none;
            text-align: center;
            animation: bounce 1.8s infinite;
        }

        .scroll-label {
            display: block;
            margin-bottom: 4px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .18em;
            color: var(--muted);
        }

        .section {
            padding: 80px 16px;
        }

        .section-alt {
            background: rgba(247, 242, 234, .65);
            border-top: 1px solid rgba(212, 175, 55, .25);
            border-bottom: 1px solid rgba(212, 175, 55, .25);
        }

        .container {
            width: min(1150px, 100%);
            margin: auto;
        }

        .section-heading {
            text-align: center;
            max-width: 720px;
            margin: 0 auto 56px;
        }

        .section-heading .script {
            display: block;
            font-size: 32px;
            margin-bottom: 3px;
        }

        .section-title {
            margin: 0;
            font: 300 clamp(38px, 5vw, 56px)/1.05 var(--serif);
            color: #1f1f1f;
        }

        .section-subtitle {
            margin: 10px 0 0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .18em;
            color: var(--muted);
        }

        .gold-line {
            width: 64px;
            height: 2px;
            background: var(--primary-light);
            margin: 15px auto 0;
        }

        .story-grid,
        .venue-grid,
        .rsvp-card-grid,
        .gift-faq-grid {
            display: grid;
            gap: 34px;
        }

        .story-grid {
            grid-template-columns: 1fr 1fr;
            align-items: center;
        }

        .story-image-wrap {
            position: relative;
        }

        .story-image-back {
            position: absolute;
            inset: 0;
            background: var(--primary-light);
            border-radius: 18px;
            transform: rotate(2deg);
        }

        .story-image {
            position: relative;
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .12);
            display: block;
        }

        .story-copy {
            font: 400 19px/1.65 var(--serif);
            color: #4b4b4b;
        }

        .story-copy h3 {
            margin: 0 0 15px;
            font: 400 34px var(--serif);
            color: #222;
        }

        .story-copy p {
            margin: 0 0 15px;
        }

        .quote {
            border-top: 1px solid var(--primary-light);
            padding-top: 15px;
            margin-top: 18px;
        }

        .quote-text {
            margin: 0;
            font: 32px var(--script);
            color: var(--primary-dark);
        }

        .quote-author {
            display: block;
            margin-top: 4px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .15em;
            color: #999;
        }

        .timeline {
            position: relative;
            max-width: 900px;
            margin: auto;
        }

        .timeline::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: var(--primary-light);
            transform: translateX(-50%);
        }

        .event {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 48px;
        }

        .event:last-child {
            margin-bottom: 0;
        }

        .event-marker {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            z-index: 2;
            font-size: 12px;
        }

        .event-copy {
            padding-top: 1px;
        }

        .event.left .event-copy:first-of-type {
            text-align: right;
            padding-right: 46px;
        }

        .event.right .event-copy:last-of-type {
            padding-left: 46px;
        }

        .event-time {
            display: inline-block;
            background: rgba(246, 229, 170, .55);
            color: var(--primary-dark);
            padding: 6px 11px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
        }

        .event-title {
            margin: 8px 0 3px;
            font: 600 27px var(--serif);
            color: #222;
        }

        .event-description {
            margin: 0;
            font: 400 15px/1.55 var(--serif);
            color: var(--muted);
        }

        .venue-grid {
            grid-template-columns: 1fr 1fr;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--primary-light);
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .07);
        }

        .venue-card {
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .icon-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-dark);
        }

        .icon-heading i {
            font-size: 20px;
        }

        .small-caps {
            text-transform: uppercase;
            letter-spacing: .15em;
            font-size: 10px;
            font-weight: 700;
        }

        .venue-name {
            margin: 9px 0 5px;
            font: 500 34px var(--serif);
            color: #222;
        }

        .address {
            margin: 0 0 18px;
            font: 400 20px/1.45 var(--serif);
            color: #555;
        }

        .card-description {
            margin: 0 0 24px;
            font-size: 13px;
            line-height: 1.65;
            color: var(--muted);
        }

        .card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid var(--champagne-dark);
            padding-top: 20px;
        }

        .hotel-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .hotel-body {
            padding: 30px;
        }

        .hotel-title {
            margin: 0 0 8px;
            font: 400 28px var(--serif);
        }

        .hotel-list {
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: .1em;
            font-size: 10px;
            color: var(--muted);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .gallery-item {
            position: relative;
            height: 260px;
            overflow: hidden;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .09);
        }

        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .5s ease;
        }

        .gallery-item:hover .gallery-image {
            transform: scale(1.08);
        }

        .gallery-overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: rgba(0, 0, 0, .24);
            color: white;
            opacity: 0;
            transition: .25s ease;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .rsvp-wrap {
            max-width: 900px;
            margin: auto;
            padding: 34px;
            position: relative;
            overflow: hidden;
        }

        .rsvp-wrap::after {
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            right: -55px;
            top: -55px;
            background: var(--primary-light);
            border-radius: 50%;
            filter: blur(35px);
            opacity: .65;
        }

        .rsvp-form {
            position: relative;
            z-index: 2;
            display: grid;
            gap: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-field {
            display: grid;
            gap: 8px;
        }

        .form-label {
            text-transform: uppercase;
            letter-spacing: .1em;
            font-size: 10px;
            font-weight: 700;
            color: #555;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 12px 13px;
            outline: none;
            background: white;
            color: #333;
            font-size: 13px;
            transition: .2s;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, .12);
        }

        .form-textarea {
            resize: vertical;
            min-height: 90px;
        }

        .form-submit {
            text-align: center;
            padding-top: 5px;
        }

        .success {
            display: none;
            text-align: center;
            padding: 55px 10px;
            position: relative;
            z-index: 2;
        }

        .success.is-visible {
            display: block;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            margin: auto;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary-dark);
            border: 1px solid var(--primary);
            font-size: 23px;
        }

        .success-title {
            margin: 14px 0 7px;
            font: 400 32px var(--serif);
        }

        .success-description {
            max-width: 520px;
            margin: auto;
            font: 400 18px/1.5 var(--serif);
            color: var(--muted);
        }

        .gift-faq-grid {
            grid-template-columns: 1fr 1fr;
        }

        .gift-card,
        .faq-card {
            padding: 30px;
        }

        .registry-account {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px;
            border: 1px solid var(--primary-light);
            border-radius: 12px;
            background: var(--champagne);
        }

        .account-label {
            display: block;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: #888;
            font-weight: 700;
        }

        .account-number {
            display: block;
            margin-top: 4px;
            font: 500 12px/1.4 monospace;
            color: #333;
        }

        .copy-button {
            border: 0;
            background: none;
            color: var(--primary-dark);
            cursor: pointer;
            padding: 8px;
        }

        .faq-list {
            display: grid;
            gap: 10px;
        }

        .faq-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .faq-summary {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            list-style: none;
            font-size: 13px;
            font-weight: 700;
            color: #444;
        }

        .faq-summary::-webkit-details-marker {
            display: none;
        }

        .faq-answer {
            margin: 8px 0 0;
            font-size: 12px;
            line-height: 1.65;
            color: var(--muted);
        }

        .footer {
            padding: 48px 16px;
            text-align: center;
            border-top: 1px solid var(--primary-light);
            background: var(--white);
        }

        .footer-name {
            font: 400 40px var(--script);
            color: var(--primary-dark);
        }

        .footer-date {
            margin: 8px 0;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .25em;
            color: #888;
        }

        .footer-tag {
            margin: 0;
            font: 12px monospace;
            color: var(--primary-dark);
        }

        .footer-line {
            width: 48px;
            height: 2px;
            background: var(--primary-light);
            margin: 14px auto;
        }

        .footer-note {
            margin: 0;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .16em;
            color: #aaa;
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 100;
            padding: 12px 18px;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .2);
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            transition: .3s ease;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 90;
            background: rgba(0, 0, 0, .9);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lightbox.is-visible {
            display: flex;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 86vh;
            border-radius: 10px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, .4);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            border: 0;
            background: none;
            color: white;
            font-size: 36px;
            cursor: pointer;
        }

        .fade-in-section {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .fade-in-section.animating {
            will-change: opacity, transform;
        }

        .fade-in-section.visible {
            opacity: 1;
            transform: translateY(0);
            will-change: auto;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 15px rgba(212, 175, 55, .2), 0 22px 70px rgba(0, 0, 0, .15);
            }

            50% {
                box-shadow: 0 0 25px rgba(212, 175, 55, .45), 0 22px 70px rgba(0, 0, 0, .15);
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translate(-50%, 0);
            }

            50% {
                transform: translate(-50%, 8px);
            }
        }

        @media (max-width:900px) {
            .nav-shell {
                display: none;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:700px) {
            .hero-card {
                padding: 28px 18px;
            }

            .hero-connector {
                display: block;
                margin: 8px 0;
            }

            .date-row {
                gap: 8px;
            }

            .countdown {
                gap: 6px;
            }

            .story-grid,
            .venue-grid,
            .gift-faq-grid {
                grid-template-columns: 1fr;
            }

            .story-image {
                height: 390px;
            }

            .timeline::before {
                left: 17px;
                transform: none;
            }

            .event {
                grid-template-columns: 1fr;
                gap: 0;
                padding-left: 50px;
                margin-bottom: 36px;
            }

            .event-marker {

            if (c.directionsUrl && c.directionsText) html += `<a href="${escapeHTML(c.directionsUrl)}" target="_blank" rel="noopener noreferrer" ${attrs(path + ".directionsUrl", "btn btn-primary")}>${c.icon ? `<i class="fas fa-directions" data-json-path="${escapeHTML(path + ".directionsText")}"></i>` : ""} ${escapeHTML(c.directionsText)}</a>`;
            if (c.address && c.copyText) html += `<button type="button" data-action="copy" data-copy="${escapeHTML(c.address)}" ${attrs(path + ".copyText", "btn btn-secondary")}>${c.icon ? `<i class="fas fa-copy" data-json-path="${escapeHTML(path + ".copyText")}"></i>` : ""} ${escapeHTML(c.copyText)}</button>`;
            html += `</div></article>`;
            html += `<article ${attrs(path, "card")}>`;
            if (c.hotelImage) html += `<img src="${escapeHTML(c.hotelImage)}" alt="${escapeHTML(c.hotelImageAlt || "")}" loading="lazy" ${attrs(path + ".hotelImage", "hotel-image")}>`;
            html += `<div ${attrs(path, "hotel-body")}>`;
            if (c.hotelTitle) html += `<h3 ${attrs(path + ".hotelTitle", "hotel-title")}>${escapeHTML(c.hotelTitle)}</h3>`;
            if (c.hotelDescription) html += `<p ${attrs(path + ".hotelDescription", "card-description")}>${escapeHTML(c.hotelDescription)}${c.bookingCode ? ` <strong ${attrs(path + ".bookingCode")}>${escapeHTML(c.bookingCode)}</strong>` : ""}</p>`;
            if (Array.isArray(c.hotels) && c.hotels.length) { html += `<ul ${attrs(path + ".hotels", "hotel-list")}>`; c.hotels.forEach((h, i) => { if (h) html += `<li ${attrs(path + ".hotels[" + i + "]")}>• ${escapeHTML(h)}</li>` }); html += `</ul>`; }
            html += `</div></article></div></div></section>`;
            return html;
        }

        function renderGallery() {
            const section = websiteData.gallery;
            if (!section || !section.content || !Array.isArray(section.content.items) || !section.content.items.length) return "";
            const c = section.content, path = "gallery.content";
            let html = `<section id="gallery" ${attrs(path, "section section-alt")}>`;
            html += `<div ${attrs(path, "container")}>`;
            html += `<div ${attrs(path, "section-heading")}>`;
            if (c.eyebrow) html += `<span ${attrs(path + ".eyebrow", "script")}>${escapeHTML(c.eyebrow)}</span>`;
            if (c.title) html += `<h2 ${attrs(path + ".title", "section-title")}>${escapeHTML(c.title)}</h2>`;
            if (c.subtitle) html += `<p ${attrs(path + ".subtitle", "section-subtitle")}>${escapeHTML(c.subtitle)}</p>`;
            html += `</div><div ${attrs(path + ".items", "gallery-grid")}>`;
            c.items.forEach((item, index) => {
                if (!item || !item.thumbnail || !item.image) return;
                const p = `${path}.items[${index}]`;
                html += `<button type="button" data-action="lightbox" data-src="${escapeHTML(item.image)}" ${attrs(p, `gallery-item gallery-item-${index}`)} aria-label="${escapeHTML(item.alt || "Open image")}">`;
                html += `<img src="${escapeHTML(item.thumbnail)}" alt="${escapeHTML(item.alt || "")}" loading="lazy" ${attrs(p + ".thumbnail", `gallery-image gallery-item-${index}`)}>`;
                html += `<span class="gallery-overlay" data-json-path="${escapeHTML(p + ".image")}"><i class="fas fa-search-plus" data-json-path="${escapeHTML(p + ".image")}"></i></span>`;
                html += `</button>`;
            });
            html += `</div></div></section>`;
            return html;
        }

        function renderRSVP() {
            const section = websiteData.rsvp;
            if (!section || !section.content || !Array.isArray(section.content.fields)) return "";
            const c = section.content, path = "rsvp.content";
            let html = `<section id="rsvp" ${attrs(path, "section")}>`;
            html += `<div ${attrs(path, "container")}>`;
            html += `<div ${attrs(path, "card rsvp-wrap")}>`;
            html += `<div ${attrs(path, "section-heading")}>`;
            if (c.eyebrow) html += `<span ${attrs(path + ".eyebrow", "script")}>${escapeHTML(c.eyebrow)}</span>`;
            if (c.title) html += `<h2 ${attrs(path + ".title", "section-title")}>${escapeHTML(c.title)}</h2>`;
            if (c.deadline) html += `<p ${attrs(path + ".deadline", "section-subtitle")}>${escapeHTML(c.deadline)}</p>`;
            html += `</div>`;
            html += `<form id="rsvpForm" ${attrs(path + ".fields", "rsvp-form")}>`;
            const fields = c.fields;
            fields.forEach((field, index) => {
                if (!field || !field.id || !field.label) return;
                const p = `${path}.fields[${index}]`;
                const needsFull = field.type === "textarea" || index === fields.length - 2 || index === fields.length - 1;
                html += `<div ${attrs(p, needsFull ? "form-field" : "form-field")}>`;
                html += `<label for="${escapeHTML(field.id)}" ${attrs(p + ".label", "form-label")}>${escapeHTML(field.label)}</label>`;
                if (field.type === "select") {
                    html += `<select id="${escapeHTML(field.id)}" ${field.required ? "required" : ""} ${attrs(p + ".options", "form-select")}>`;
                    if (Array.isArray(field.options)) field.options.forEach((option, oi) => { if (option && option.label) html += `<option value="${escapeHTML(option.value || "")}" ${attrs(p + ".options[" + oi + "].label")}>${escapeHTML(option.label)}</option>` });
                    html += `</select>`;
                } else if (field.type === "textarea") {
                    html += `<textarea id="${escapeHTML(field.id)}" rows="${escapeHTML(field.rows || 3)}" placeholder="${escapeHTML(field.placeholder || "")}" ${attrs(p + ".placeholder", "form-textarea")}></textarea>`;
                } else {
                    html += `<input id="${escapeHTML(field.id)}" type="${escapeHTML(field.type || "text")}" ${field.required ? "required" : ""} placeholder="${escapeHTML(field.placeholder || "")}" ${attrs(p + ".placeholder", "form-input")}>`;
                }
                html += `</div>`;
            });
            if (c.submitText) html += `<div ${attrs(path + ".submitText", "form-submit")}><button type="submit" ${attrs(path + ".submitText", "btn btn-primary")}>${escapeHTML(c.submitText)}</button></div>`;
            html += `</form>`;
            html += `<div id="rsvpSuccess" ${attrs(path, "success")}><div ${attrs(path + ".successIcon", "success-icon")}><i class="fas ${escapeHTML(c.successIcon || "fa-heart")}" data-json-path="${escapeHTML(path + ".successIcon")}"></i></div>`;
            if (c.successTitle) html += `<h3 ${attrs(path + ".successTitle", "success-title")}>${escapeHTML(c.successTitle)}</h3>`;
            if (c.successDescription) html += `<p ${attrs(path + ".successDescription", "success-description")}>${escapeHTML(c.successDescription)}</p>`;
            if (c.resetText) html += `<button type="button" data-action="reset-rsvp" ${attrs(path + ".resetText", "btn btn-secondary")}>${escapeHTML(c.resetText)}</button>`;
            html += `</div></div></div></section>`;
            return html;
        }

        function renderGiftsFaq() {
            const section = websiteData.giftsFaq;
            if (!section || !section.content) return "";
            const c = section.content, path = "giftsFaq.content";
            let html = `<section ${attrs(path, "section section-alt")}>`;
            html += `<div ${attrs(path, "container gift-faq-grid")}>`;
            const r = c.registry;
            if (r) {
                html += `<article ${attrs(path + ".registry", "card gift-card")}>`;
                html += `<div ${attrs(path + ".registry", "icon-heading")}>${r.icon ? `<i class="fas ${escapeHTML(r.icon)}" data-json-path="${escapeHTML(path + ".registry.icon")}"></i>` : ""}${r.title ? `<h3 ${attrs(path + ".registry.title", "hotel-title")}>${escapeHTML(r.title)}</h3>` : ""}</div>`;
                if (r.description) html += `<p ${attrs(path + ".registry.description", "card-description")}>${escapeHTML(r.description)}</p>`;
                if (r.account) {
                    html += `<div ${attrs(path + ".registry.account", "registry-account")}><div ${attrs(path + ".registry.account", "")}>`;
                    if (r.accountLabel) html += `<span ${attrs(path + ".registry.accountLabel", "account-label")}>${escapeHTML(r.accountLabel)}</span>`;
                    html += `<span ${attrs(path + ".registry.account", "account-number")}>${escapeHTML(r.account)}</span></div>`;
                    html += `<button type="button" data-action="copy" data-copy="${escapeHTML(r.account)}" ${attrs(path + ".registry.copyIcon", "copy-button")}><i class="fas ${escapeHTML(r.copyIcon || "fa-copy")}" data-json-path="${escapeHTML(path + ".registry.copyIcon")}"></i></button></div>`;
                }
                html += `</article>`;
            }
            const faq = c.faq;
            if (faq) {
                html += `<article ${attrs(path + ".faq", "card faq-card")}>`;
                html += `<div ${attrs(path + ".faq", "icon-heading")}>${faq.icon ? `<i class="fas ${escapeHTML(faq.icon)}" data-json-path="${escapeHTML(path + ".faq.icon")}"></i>` : ""}${faq.title ? `<h3 ${attrs(path + ".faq.title", "hotel-title")}>${escapeHTML(faq.title)}</h3>` : ""}</div>`;
                if (Array.isArray(faq.items) && faq.items.length) {
                    html += `<div ${attrs(path + ".faq.items", "faq-list")}>`;
                    faq.items.forEach((item, index) => { if (!item) return; const p = `${path}.faq.items[${index}]`; html += `<details ${attrs(p, "faq-item")}><summary ${attrs(p + ".question", "faq-summary")}>${escapeHTML(item.question || "")}<span data-json-path="${escapeHTML(p + ".question")}"><i class="fas fa-chevron-down"></i></span></summary>${item.answer ? `<p ${attrs(p + ".answer", "faq-answer")}>${escapeHTML(item.answer)}</p>` : ""}</details>` });
                    html += `</div>`;
                }
                html += `</article>`;
            }
            html += `</div></section>`;
            return html;
        }

        function renderFooter() {
            const section = websiteData.footer;
            if (!section || !section.content) return "";
            const c = section.content, path = "footer.content";
            const brand = websiteData.brand && websiteData.brand.content;
            let html = `<footer ${attrs(path, "footer")}>`;
            if (brand && brand.name) html += `<span ${attrs("brand.content.name", "footer-name")}>${escapeHTML(brand.name)}</span>`;
            if (c.dateLocation) html += `<p ${attrs(path + ".dateLocation", "footer-date")}>${escapeHTML(c.dateLocation)}</p>`;
            if (brand && brand.hashtag) html += `<p ${attrs("brand.content.hashtag", "footer-tag")}>${escapeHTML(brand.hashtag)}</p>`;
            html += `<div class="footer-line" data-json-path="${escapeHTML(path)}"></div>`;
            if (brand && brand.footerNote) html += `<p ${attrs("brand.content.footerNote", "footer-note")}>${escapeHTML(brand.footerNote)}</p>`;
            html += `</footer>`;
            return html;
        }

        function renderOverlays() {
            return `<div id="lightbox" ${attrs("gallery.content", "lightbox")}><button type="button" data-action="close-lightbox" ${attrs("gallery.content", "lightbox-close")} aria-label="Close">&times;</button><img id="lightbox-img" alt="" ${attrs("gallery.content", "lightbox-image")}></div>
    <div id="toast" ${attrs("brand.content", "toast")}><i class="fas fa-check-circle" data-json-path="brand.content"></i><span id="toast-msg" data-json-path="brand.content">${escapeHTML((websiteData.brand && websiteData.brand.content && websiteData.brand.content.name) ? "Copied to clipboard!" : "Copied!")}</span></div>`;
        }

        function renderDataAll(data) {
            if (data) websiteData = data;
            applyDocumentTitle();
            applyDocumentTitle();
            applyTheme();
            preloadHeroImage();
            const parent = document.getElementById("parent");
            if (!parent) return;
            parent.innerHTML = `
        <div class="page-shell" data-json-path="brand.content">
            <canvas id="petal-canvas" class="canvas-bg" data-json-path="brand.content"></canvas>
            ${renderAudioControl()}
            ${renderNavigation()}
            ${renderHero()}
            ${renderStory()}
            ${renderSchedule()}
            ${renderVenue()}
            ${renderGallery()}
            ${renderRSVP()}
            ${renderGiftsFaq()}
            ${renderFooter()}
            ${renderOverlays()}
        </div>`;
            initializeComponents();
        }

        function initializeComponents() {
            initCountdown();
            initPetals();
            initScrollAnimations();
            initLazyBehavior();
            syncAudioButton();
        }

        function initCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            const date = websiteData.hero && websiteData.hero.content && websiteData.hero.content.date;
            if (!date) return;
            const target = new Date("October 24, 2026 15:30:00").getTime();
            const update = () => {
                const diff = target - Date.now();
                ["days", "hours", "minutes", "seconds"].forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    let value = 0;
                    if (id === "days") value = Math.floor(diff / (1000 * 60 * 60 * 24));
                    if (id === "hours") value = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    if (id === "minutes") value = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    if (id === "seconds") value = Math.floor((diff % (1000 * 60)) / 1000);
                    el.textContent = String(Math.max(0, value)).padStart(2, "0");
                });
            };
            update();
            countdownInterval = setInterval(update, 1000);
        }

        function initScrollAnimations() {
            if (!("IntersectionObserver" in window)) {
                document.querySelectorAll(".fade-in-section").forEach(el => el.classList.add("visible"));
                return;
            }
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("animating");
                        requestAnimationFrame(() => {
                            entry.target.classList.add("visible");
                            entry.target.classList.remove("animating");
                        });
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: .15, rootMargin: "0px 0px -50px 0px" });
            document.querySelectorAll(".fade-in-section").forEach(el => observer.observe(el));
        }

        function initLazyBehavior() {
            // Images already use loading="lazy". Keep heavy interactive media deferred.
        }

        function initPetals() {
            const canvas = document.getElementById("petal-canvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            if (!ctx) return;
            const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
            resize();
            window.removeEventListener("resize", window.__petalResize);
            window.__petalResize = resize;
            window.addEventListener("resize", resize, { passive: true });
            const petals = Array.from({ length: 24 }, () => ({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                size: Math.random() * 7 + 5, speedY: Math.random() * 1.1 + .5, speedX: Math.random() * .7 - .35,
                rotation: Math.random() * 360, rotSpeed: Math.random() * 1.4 - .7, opacity: Math.random() * .45 + .25
            }));
            if (animationFrame) cancelAnimationFrame(animationFrame);
            const animate = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                petals.forEach(p => {
                    p.y += p.speedY; p.x += Math.sin(p.y * .01) + p.speedX; p.rotation += p.rotSpeed;
                    if (p.y > canvas.height + 20) { p.y = -20; p.x = Math.random() * canvas.width; }
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = `rgba(249,210,210,${p.opacity})`; ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                });
                animationFrame = requestAnimationFrame(animate);
            };
            animate();
        }

        function getAudioConfig() {
            return websiteData.audio && websiteData.audio.content ? websiteData.audio.content : {};
        }

        function syncAudioButton() {
            const c = getAudioConfig();
            const text = document.getElementById("music-text");
            const icon = document.getElementById("music-icon");
            if (!text || !icon) return;
            text.textContent = isPlaying ? (c.labelPause || "Pause Music") : (c.labelPlay || "Play Music");
            icon.className = `fas ${isPlaying ? (c.iconPause || "fa-pause") : (c.iconPlay || "fa-music")}`;
        }

        async function startAudio() {
            const c = getAudioConfig();
            if (!c.autoplay && !autoplayPending) return false;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === "suspended") await audioCtx.resume();
                if (audioCtx.state !== "running") throw new Error("AudioContext not running");
                if (!isPlaying) {
                    isPlaying = true;
                    startSynthesizedMelody();
                }
                autoplayPending = false;
                syncAudioButton();
                return true;
            } catch (error) {
                autoplayPending = true;
                isPlaying = false;
                syncAudioButton();
                return false;
            }
        }

        function toggleAudio() {
            if (isPlaying) {
                stopSynthesizedMelody();
                isPlaying = false;
                syncAudioButton();
                return;
            }
            startAudio();
        }

        function playSoftTone(freq, duration, delay = 0) {
            if (!audioCtx || !isPlaying) return;
            setTimeout(() => {
                if (!isPlaying || !audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(.001, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(Math.max(.001, getAudioConfig().volume || .08), audioCtx.currentTime + .1);
                    gain.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + duration);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + duration);
                } catch (e) { }
            }, delay);
        }

        function startSynthesizedMelody() {
            if (melodyInterval) clearInterval(melodyInterval);
            const c = getAudioConfig();
            const chords = Array.isArray(c.chords) && c.chords.length ? c.chords : [];
            if (!chords.length) return;
            let chordIndex = 0;
            const playPattern = () => {
                if (!isPlaying) return;
                const notes = chords[chordIndex] || [];
                if (notes[0]) playSoftTone(notes[0], 2.5, 0);
                if (notes[1]) playSoftTone(notes[1], 2.2, 400);
                if (notes[2]) playSoftTone(notes[2], 2.0, 800);
                if (notes[1]) playSoftTone(notes[1] * 2, 2.0, 1200);
                chordIndex = (chordIndex + 1) % chords.length;
            };
            playPattern();
            melodyInterval = setInterval(playPattern, Number(c.patternInterval) || 2400);
        }

        function stopSynthesizedMelody() {
            if (melodyInterval) { clearInterval(melodyInterval); melodyInterval = null; }
        }

        function attemptAutoplay() {
            const c = getAudioConfig();
            if (!c.autoplay) return;
            autoplayPending = true;
            startAudio().then(started => {
                if (!started) {
                    const unlock = () => {
                        if (!autoplayPending) return;
                        startAudio();
                        window.removeEventListener("pointerdown", unlock);
                        window.removeEventListener("keydown", unlock);
                        window.removeEventListener("touchstart", unlock);
                    };
                    window.addEventListener("pointerdown", unlock, { once: true, passive: true });
                    window.addEventListener("keydown", unlock, { once: true });
                    window.addEventListener("touchstart", unlock, { once: true, passive: true });
                }
            });
        }

        function showToast(message) {
            const toast = document.getElementById("toast"), msg = document.getElementById("toast-msg");
            if (!toast || !msg) return;
            msg.textContent = message;
            toast.classList.add("visible");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove("visible"), 2500);
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const input = document.createElement("input");
                input.value = text; document.body.appendChild(input); input.select();
                document.execCommand("copy"); input.remove();
            }
            showToast("Copied to clipboard!");
        }

        function openLightbox(src) {
            const box = document.getElementById("lightbox"), img = document.getElementById("lightbox-img");
            if (!box || !img) return;
            img.src = src; box.classList.add("is-visible");
        }

        function closeLightbox() {
            const box = document.getElementById("lightbox");
            if (box) box.classList.remove("is-visible");
        }

        function handleRSVP(event) {
            event.preventDefault();
            const form = document.getElementById("rsvpForm"), success = document.getElementById("rsvpSuccess");
            if (!form || !success) return;
            form.style.display = "none";
            success.classList.add("is-visible");
            if (typeof confetti === "function") {
                confetti({ particleCount: 120, spread: 80, origin: { y: .6 } });
            }
        }

        function resetRSVPForm() {
            const form = document.getElementById("rsvpForm"), success = document.getElementById("rsvpSuccess");
            if (!form || !success) return;
            form.reset(); form.style.display = "grid"; success.classList.remove("is-visible");
        }

        document.addEventListener("click", event => {
            const target = event.target.closest("[data-action], [data-json-path]");
            if (!target) return;
            const action = target.dataset.action;
            if (action === "toggle-audio") { toggleAudio(); return; }
            if (action === "copy") { copyText(target.dataset.copy || ""); return; }
            if (action === "lightbox") { openLightbox(target.dataset.src || ""); return; }
            if (action === "close-lightbox") { closeLightbox(); return; }
            if (action === "reset-rsvp") { resetRSVPForm(); return; }
            const jsonPath = target.dataset.jsonPath;
            if (jsonPath) {
                window.parent.postMessage({ type: "ELEMENT_CLICKED", jsonPath }, "*");
            }
        });

        document.addEventListener("submit", event => {
            if (event.target && event.target.id === "rsvpForm") handleRSVP(event);
        });

        window.addEventListener("message", event => {
            if (event.data && event.data.type === "UPDATE_DATA") {
                renderDataAll(event.data.data);
            }
        });

        window.addEventListener("scroll", () => {
            if (scrollTicking) return;
            scrollTicking = true;
            requestAnimationFrame(() => {
                scrollTicking = false;
            });
        }, { passive: true });

        document.addEventListener("DOMContentLoaded", () => {
            renderDataAll();
            attemptAutoplay();
        });
    </script>
</body>
