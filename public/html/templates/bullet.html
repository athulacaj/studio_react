<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jhon&amp;Anu</title>

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&amp;family=Josefin+Sans:wght@200;300;400;500&amp;display=swap"
    rel="stylesheet">

  <style>
    :root {
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Josefin Sans', 'Helvetica Neue', Arial, sans-serif;

      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: auto;
    }

    body {
      margin: 0;
      background: var(--theme-background);
      color: var(--theme-primary);
      font-family: var(--font-body);
      font-weight: 300;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* SCROLL REVEAL */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.9s var(--ease-out-expo), transform 0.9s var(--ease-out-expo);
    }

    .reveal.animating {
      will-change: opacity, transform;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
      will-change: auto;
    }

    .reveal-delay-1 {
      transition-delay: 0.12s;
    }

    .reveal-delay-2 {
      transition-delay: 0.24s;
    }

    .reveal-delay-3 {
      transition-delay: 0.36s;
    }

    .reveal-delay-4 {
      transition-delay: 0.48s;
    }

    /* HERO / WALK STAGE */
    .walk-section {
      position: relative;
      height: 500vh;
    }

    .walk-stage {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background: var(--theme-primary-deep);
    }

    .layer {
      position: absolute;
      inset: -8%;
      width: 116%;
      height: 116%;
      pointer-events: none;
      user-select: none;
    }

    .far-background {
      z-index: 1;
      /* background-position: center center; */
      background-size: cover;
      transform: scale(1.08);
      filter: saturate(.92);
      background-size: 308%;

    }

    .mid-background {
      z-index: 2;
      background-position: center center;
      background-size: cover;
      transform: scale(1.04);
      opacity: .94;
    }

    .couple-wrap {
      position: absolute;
      z-index: 5;
      left: 0;
      bottom: 22%;
      width: min(30vw, 450px);
      min-width: 280px;
      transform: translate3d(0, 0, 0) scale(1);
      transform-origin: 50% 90%;
      pointer-events: none;
    }

    .ground-shadow {
      position: absolute;
      bottom: 0%;
      left: 10%;
      width: 80%;
      height: 22px;
      background: radial-gradient(ellipse at center, var(--theme-ground-shadow) 0%, var(--theme-ground-shadow-soft) 50%, transparent 80%);
      filter: blur(6px);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
    }

    .couple {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 18px 22px var(--theme-shadow)) drop-shadow(0 4px 6px var(--theme-shadow-soft)) brightness(0.97) contrast(1.02);
    }

    .atmosphere {
      position: absolute;
      z-index: 7;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 38%, var(--theme-overlay-soft) 70%, var(--theme-overlay) 100%);
    }

    .sun-glow {
      position: absolute;
      z-index: 6;
      width: 55vw;
      height: 55vw;
      max-width: 900px;
      max-height: 900px;
      left: 50%;
      top: 5%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, var(--theme-glow), transparent 68%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    #globalParticleCanvas {
      position: fixed;
      z-index: 12;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .story-copy {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 13vh;
      width: min(90vw, 720px);
      transform: translateX(-50%);
      text-align: center;
      color: var(--theme-on-dark);
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 2px 18px var(--theme-shadow-strong);
    }

    .eyebrow {
      margin-bottom: 14px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: .32em;
      text-transform: uppercase;
      opacity: .85;
    }

    .story-copy h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(48px, 7vw, 108px);
      line-height: .92;
      font-weight: 300;
      font-style: italic;
    }

    .story-copy p {
      margin: 24px auto 0;
      max-width: 460px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 200;
      line-height: 1.7;
      letter-spacing: .05em;
      opacity: .9;
    }

    .scroll-hint {
      position: absolute;
      z-index: 11;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      color: var(--theme-on-dark);
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: .28em;
      text-transform: uppercase;
      opacity: .78;
      transition: opacity .3s ease;
    }

    .scroll-line {
      width: 1px;
      height: 48px;
      margin: 10px auto 0;
      background: var(--theme-on-dark65);
      transform-origin: top;
      animation: scrollLine 1.8s ease-in-out infinite;
    }

    @keyframes scrollLine {

      0%,
      100% {
        transform: scaleY(.45);
        opacity: .35;
      }

      50% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    /* DIVIDERS */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 24px;
      margin: 0 auto;
      max-width: 400px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--theme-accent-light), transparent);
    }

    .divider-diamond {
      width: 8px;
      height: 8px;
      border: 1px solid var(--theme-accent);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    .shimmer-line {
      height: 1px;
      max-width: 260px;
      margin: 28px auto;
      background: linear-gradient(90deg, transparent 0%, var(--theme-accent-light) 25%, var(--theme-accent) 50%, var(--theme-accent-light) 75%, transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 4s ease-in-out infinite;
    }

    /* NAMES & DATE SECTION */
    .names-section {
      position: relative;
      padding: 120px 24px 100px;
      text-align: center;
      background: var(--theme-surface);
      overflow: hidden;
    }

    .names-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 180px;
      background: linear-gradient(to bottom, var(--theme-primary-deep), transparent);
      opacity: 0.04;
      pointer-events: none;
    }

    .names-eyebrow {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--theme-muted);
      margin-bottom: 28px;
    }

    .couple-names {
      font-family: var(--font-display);
      font-size: clamp(52px, 9vw, 120px);
      font-weight: 300;
      font-style: italic;
      line-height: 1;
      color: var(--theme-primary);
      margin: 0;
    }

    .couple-names .amp {
      display: inline-block;
      font-size: 0.55em;
      font-style: normal;
      color: var(--theme-accent);
      margin: 0 0.15em;
      vertical-align: 0.08em;
    }

    .wedding-date {
      margin-top: 36px;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 300;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--theme-accent-dark);
    }

    .save-the-date {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 36px;
      border: 1px solid var(--theme-accent);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--theme-accent-dark);
      background: transparent;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.4s var(--ease-out-quart);
    }

    .save-the-date:hover {
      background: var(--theme-accent);
      color: var(--theme-on-dark);
      transform: scale(1.03);
      box-shadow: 0 8px 32px var(--theme-accent25);
    }

    /* TIMELINE */
    .timeline-section {
      position: relative;
      padding: 100px 24px 120px;
      background: var(--theme-background);
      overflow: hidden;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 64px;
    }

    .section-heading span {
      display: block;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--theme-muted);
      margin-bottom: 16px;
    }

    .section-heading h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(38px, 5.5vw, 72px);
      font-weight: 300;
      font-style: italic;
      color: var(--theme-primary);
      line-height: 1.1;
    }

    .timeline {
      position: relative;
      max-width: 700px;
      margin: 0 auto;
      padding-left: 40px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 16px;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--theme-accent-light) 15%, var(--theme-accent-light) 85%, transparent);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 56px;
      padding: 32px 36px;
      background: var(--theme-surface);
      border-radius: 2px;
      box-shadow: 0 2px 24px var(--theme-shadow-soft), 0 1px 4px var(--theme-shadow-faint);
      transition: transform 0.4s var(--ease-out-quart), box-shadow 0.4s var(--ease-out-quart);
    }

    .timeline-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 40px var(--theme-shadow), 0 2px 8px var(--theme-shadow-soft);
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -32px;
      top: 36px;
      width: 10px;
      height: 10px;
      background: var(--theme-accent);
      border: 2px solid var(--theme-background);
      border-radius: 50%;
      box-shadow: 0 0 0 3px var(--theme-accent-light);
    }

    .timeline-year {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--theme-accent-dark);
      margin-bottom: 8px;
    }

    .timeline-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 500;
      font-style: italic;
      color: var(--theme-primary);
      margin-bottom: 10px;
    }

    .timeline-desc {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 300;
      line-height: 1.8;
      color: var(--theme-muted);
      margin: 0;
    }

    /* VENUE / CELEBRATION */
    .venue-section {
      position: relative;
      padding: 100px 24px 120px;
      background: var(--theme-primary-deep);
      color: var(--theme-on-dark);
      overflow: hidden;
    }

    .venue-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, var(--theme-accent06), transparent 50%),
        radial-gradient(ellipse at 70% 80%, var(--theme-accent04), transparent 50%);
      pointer-events: none;
    }

    .venue-section .section-heading span {
      color: var(--theme-accent-light);
      opacity: 0.7;
    }

    .venue-section .section-heading h2 {
      color: var(--theme-on-dark);
    }

    .venue-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
      max-width: 800px;
      margin: 0 auto;
    }

    .venue-card {
      position: relative;
      padding: 48px 36px;
      border: 1px solid var(--theme-accent20);
      border-radius: 2px;
      text-align: center;
      background: var(--theme-glass);
    }

    @supports (backdrop-filter: blur(6px)) {
      .venue-card {
        backdrop-filter: blur(6px);
      }
    }

    .venue-card:hover {
      border-color: var(--theme-accent45);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px var(--theme-shadow);
    }

    .venue-icon {
      font-size: 28px;
      margin-bottom: 20px;
      opacity: 0.8;
    }

    .venue-label {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--theme-accent-light);
      margin-bottom: 16px;
    }

    .venue-name {
      font-family: var(--font-display);
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 400;
      font-style: italic;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .venue-details {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 200;
      line-height: 1.9;
      color: var(--theme-on-dark65);
    }

    .venue-time {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 20px;
      border: 1px solid var(--theme-accent30);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: .2em;
      color: var(--theme-accent-light);
    }

    /* GALLERY */
    .gallery-section {
      padding: 120px 24px;
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      margin-top: 56px;
    }

    .gallery-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      background: var(--theme-primary-deep);
      border: 1px solid var(--theme-accent25);
      box-shadow: 0 12px 32px var(--theme-shadow-soft);
      cursor: pointer;
      transition: transform 0.5s var(--ease-out-expo), box-shadow 0.5s var(--ease-out-expo), border-color 0.4s ease;
    }

    .gallery-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 24px 48px var(--theme-shadow);
      border-color: var(--theme-accent);
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s var(--ease-out-expo), filter 0.5s ease;
      filter: brightness(0.95);
    }

    .gallery-card:hover img {
      transform: scale(1.08);
      filter: brightness(1.03);
    }

    .gallery-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--theme-overlay-strong) 0%, var(--theme-overlay-soft2) 60%, transparent 100%);
      opacity: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 24px;
      transition: opacity 0.4s var(--ease-out-expo);
    }

    .gallery-card:hover .gallery-card-overlay {
      opacity: 1;
    }

    .gallery-card-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--theme-accent90);
      color: var(--theme-primary-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 12px;
      transform: translateY(12px) scale(0.9);
      transition: transform 0.4s var(--ease-out-expo);
      box-shadow: 0 4px 12px var(--theme-shadow);
    }

    .gallery-card:hover .gallery-card-icon {
      transform: translateY(0) scale(1);
    }

    .gallery-card-caption {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--theme-background);
      letter-spacing: 0.04em;
      transform: translateY(12px);
      transition: transform 0.4s var(--ease-out-expo);
    }

    .gallery-card:hover .gallery-card-caption {
      transform: translateY(0);
    }

    /* LIGHTBOX MODAL */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: var(--theme-modal);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.4s var(--ease-out-expo), visibility 0.4s var(--ease-out-expo);
      user-select: none;
    }

    @supports (backdrop-filter: blur(20px)) {
      .lightbox-modal {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    }

    .lightbox-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .lightbox-image-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 32px 80px var(--theme-shadow-strong), 0 0 0 1px var(--theme-accent30);
      max-height: 75vh;
      max-width: 88vw;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      display: block;
      transform: scale(0.96);
      opacity: 0;
      transition: transform 0.4s var(--ease-out-expo), opacity 0.4s var(--ease-out-expo);
    }

    .lightbox-modal.active .lightbox-img {
      transform: scale(1);
      opacity: 1;
    }

    .lightbox-caption-bar {
      margin-top: 20px;
      text-align: center;
      color: var(--theme-background);
    }

    .lightbox-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--theme-accent-light);
      letter-spacing: 0.05em;
      margin: 0 0 4px 0;
    }

    .lightbox-counter {
      font-family: var(--font-body);
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--theme-on-dark50);
      text-transform: uppercase;
    }

    .lightbox-close,
    .lightbox-nav {
      position: absolute;
      border-radius: 50%;
      background: var(--theme-glass-strong);
      border: 1px solid var(--theme-accent30);
      color: var(--theme-background);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
      z-index: 100000;
    }

    .lightbox-close {
      top: 24px;
      right: 28px;
      width: 48px;
      height: 48px;
      font-size: 22px;
    }

    .lightbox-nav {
      top: 50%;
      transform: translateY(-50%);
      width: 54px;
      height: 54px;
      font-size: 24px;
    }

    .lightbox-close:hover,
    .lightbox-nav:hover {
      background: var(--theme-accent25);
      border-color: var(--theme-accent);
      transform: translateY(-50%) scale(1.08);
    }

    .lightbox-close:hover {
      transform: scale(1.08);
    }

    .lightbox-prev {
      left: 28px;
    }

    .lightbox-next {
      right: 28px;
    }

    /* COUNTDOWN */
    .countdown-section {
      position: relative;
      padding: 100px 24px;
      text-align: center;
      background: linear-gradient(to bottom, var(--theme-surface), var(--theme-background));
      overflow: hidden;
    }

    .countdown-grid {
      display: flex;
      justify-content: center;
      gap: clamp(16px, 4vw, 40px);
      margin-top: 48px;
      flex-wrap: wrap;
    }

    .countdown-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 90px;
    }

    .countdown-number {
      font-family: var(--font-display);
      font-size: clamp(48px, 8vw, 80px);
      font-weight: 300;
      color: var(--theme-primary);
      line-height: 1;
      transition: transform 0.3s var(--ease-out-quart);
    }

    .countdown-number.tick {
      transform: scale(1.08);
    }

    .countdown-label {
      margin-top: 10px;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--theme-muted);
    }

    .countdown-separator {
      font-family: var(--font-display);
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 300;
      color: var(--theme-accent-light);
      align-self: flex-start;
      margin-top: 8px;
    }

    /* RSVP */
    .rsvp-section {
      position: relative;
      padding: 120px 24px;
      text-align: center;
      background: var(--theme-background);
      overflow: hidden;
    }

    .rsvp-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, var(--theme-accent06), transparent 60%);
      pointer-events: none;
    }

    .rsvp-text {
      max-width: 520px;
      margin: 24px auto 0;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 200;
      line-height: 1.8;
      color: var(--theme-muted);
    }

      display: inline-block;
      margin-top: 40px;
      padding: 18px 56px;
      background: var(--theme-accent);
      color: var(--theme-on-dark);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .28em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.45s var(--ease-out-quart);
    }

    .rsvp-btn:hover {
      background: var(--theme-accent-dark);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 40px var(--theme-accent30);
    }

    .footer {
      padding: 80px 24px 48px;
      text-align: center;
      background: var(--theme-primary-deep);
      color: var(--theme-on-dark50);
    }

    .footer-monogram {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 300;
      font-style: italic;
      color: var(--theme-accent);
      margin-bottom: 24px;
    }

    .footer-hashtag {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 300;
      letter-spacing: .2em;
      color: var(--theme-accent-light);
      margin-bottom: 8px;
    }

    .footer-note {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 200;
      letter-spacing: .1em;
      margin-top: 48px;
      color: var(--theme-on-dark30);
    }

    .footer-note span {
      color: var(--theme-danger);
    }


    /* ==========================================================
     * CLICK-TO-OPEN WEDDING INTRO
     * ========================================================== */
    .opening-screen {
      position: fixed;
      inset: 0;
      z-index: 200000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--theme-primary-deep);
      color: var(--theme-background);
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    .opening-screen.is-open {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .opening-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 42%, var(--theme-accent14), transparent 34%),
        radial-gradient(circle at 50% 100%, var(--theme-secondary10), transparent 45%);
      pointer-events: none;
    }

    .opening-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 20%, var(--theme-shadow) 100%);
      pointer-events: none;
    }

    .opening-curtain {
      position: absolute;
      top: -5%;
      bottom: -5%;
      width: 52%;
      z-index: 2;
      background:
        linear-gradient(90deg, var(--theme-primary-deep95), var(--theme-primary98) 30%, var(--theme-primary-deep98) 72%, var(--theme-primary-deeper98));
      box-shadow: inset 0 0 80px var(--theme-shadow-strong);
      transition: transform 1.45s var(--ease-out-expo);
    }

    .opening-curtain.left {
      left: 0;
      transform-origin: left center;
      border-right: 1px solid var(--theme-accent18);
    }

    .opening-curtain.right {
      right: 0;
      transform-origin: right center;
      border-left: 1px solid var(--theme-accent18);
      background:
        linear-gradient(90deg, var(--theme-primary-deeper98), var(--theme-primary-deep98) 28%, var(--theme-primary98) 70%, var(--theme-primary-deep95));
    }

    .opening-screen.opening .opening-curtain.left {
      transform: translateX(-105%);
    }

    .opening-screen.opening .opening-curtain.right {
      transform: translateX(105%);
    }

    .opening-curtain::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: .28;
      background:
        repeating-linear-gradient(90deg,
          transparent 0,
          transparent 26px,
          var(--theme-pattern) 28px,
          transparent 31px);
    }

    .opening-center {
      position: relative;
      z-index: 5;
      width: min(90vw, 560px);
      text-align: center;
      padding: 42px 28px;
      transition: opacity .45s ease, transform .8s var(--ease-out-expo);
    }

    .opening-screen.opening .opening-center {
      opacity: 0;
      transform: translateY(-20px) scale(.97);
    }

    .opening-eyebrow {
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: .42em;
      text-transform: uppercase;
      color: var(--theme-accent-light);
      margin-bottom: 22px;
    }

    .opening-monogram {
      width: 86px;
      height: 86px;
      margin: 0 auto 26px;
      border: 1px solid var(--theme-accent75);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 31px;
      font-style: italic;
      color: var(--theme-accent-light);
      box-shadow:
        0 0 0 8px var(--theme-accent035),
        0 0 45px var(--theme-accent10);
    }

    .opening-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(48px, 8vw, 86px);
      line-height: .92;
      font-weight: 300;
      font-style: italic;
      color: var(--theme-background);
    }

    .opening-subtitle {
      margin: 18px auto 0;
      max-width: 390px;
      font-family: var(--font-body);
      font-size: 12px;
      line-height: 1.8;
      letter-spacing: .08em;
      color: var(--theme-on-dark68);
    }

    .opening-button {
      position: relative;
      margin-top: 34px;
      min-width: 190px;
      padding: 15px 28px;
      border: 1px solid var(--theme-accent);
      background: var(--theme-accent08);
      color: var(--theme-background);
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: .3em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .35s ease, color .35s ease, transform .35s var(--ease-out-quart), box-shadow .35s ease;
    }

    .opening-button::before,
    .opening-button::after {
      content: '✦';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--theme-accent);
      font-size: 9px;
    }

    .opening-button::before {
      left: 12px;
    }

    .opening-button::after {
      right: 12px;
    }

    .opening-button:hover {
      background: var(--theme-accent);
      color: var(--theme-primary-deep);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px var(--theme-accent22);
    }

    .opening-hint {
      margin-top: 18px;
      font-family: var(--font-body);
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--theme-on-dark42);
    }

    .opening-screen.opening .opening-hint {
      opacity: 0;
    }

    .opening-leaf {
      position: absolute;
      z-index: 4;
      width: 180px;
      height: 180px;
      opacity: .28;
      pointer-events: none;
      border-radius: 100% 0 100% 0;
      border-left: 1px solid var(--theme-accent50);
      border-bottom: 1px solid var(--theme-accent50);
      transform: rotate(35deg);
    }

    .opening-leaf.top-left {
      top: -80px;
      left: -55px;
    }

    .opening-leaf.bottom-right {
      right: -55px;
      bottom: -80px;
      transform: rotate(215deg);
    }

    @media (max-width: 700px) {
      .opening-curtain {
        width: 55%;
      }

      .opening-center {
        padding: 30px 20px;
      }

      .opening-monogram {
        width: 72px;
        height: 72px;
        font-size: 27px;
        margin-bottom: 22px;
      }

      .opening-title {
        font-size: clamp(44px, 14vw, 68px);
      }

      .opening-subtitle {
        font-size: 11px;
      }

      .opening-button {
        margin-top: 28px;
      }
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }

    @media (max-width: 700px) {
      .walk-section {
        height: 430vh;
      }

      .layer {
        inset: -14%;
        width: 128%;
        height: 128%;
      }

      /* .far-background {
        background-position: 20% 20%;
      } */

      .mid-background {
        background-position: 20% 20%;
      }

      .couple-wrap {
        width: min(75vw, 360px);
        min-width: 240px;
        bottom: 24%;
      }

      .story-copy {
        top: 11vh;
      }

      .story-copy h1 {
        font-size: clamp(46px, 14vw, 76px);
      }

      .names-section {
        padding: 80px 20px 70px;
      }

      .venue-cards {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .venue-card {
        padding: 36px 24px;
      }

      .timeline {
        padding-left: 32px;
      }

      .timeline::before {
        left: 10px;
      }

      .timeline-item {
        padding: 24px;
        margin-bottom: 40px;
      }

      .timeline-item::before {
        left: -28px;
        width: 8px;
        height: 8px;
      }

      .countdown-separator {
        display: none;
      }

      .countdown-unit {
        min-width: 70px;
      }

      .gallery-section {
        padding: 80px 16px;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .lightbox-prev {
        left: 12px;
        width: 44px;
        height: 44px;
        font-size: 20px;
      }

      .lightbox-next {
        right: 12px;
        width: 44px;
        height: 44px;
        font-size: 20px;
      }

      .lightbox-close {
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        font-size: 18px;
      }
    }

    /* ACCESSIBILITY: REDUCED MOTION */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Helper: Remove DOM Element if missing */
    function removeSection(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    /* Dynamic Hero Image Preload */
    function preloadHeroImage() {
      if (websiteData.hero && websiteData.hero.content && websiteData.hero.content.coupleImage) {
        const link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = websiteData.hero.content.coupleImage;
        document.head.appendChild(link);
      }
    }

    /* ==========================================================
     * SECTION RENDERERS
     * ========================================================== */

    function getOrCreateSection(id, tagName = 'section', className = '') {
      let el = document.getElementById(id);
      if (!el) {
        el = document.createElement(tagName);
        el.id = id;
        if (className) el.className = className;
        document.getElementById('parent').appendChild(el);
      }
      return el;
    }

    function renderHero() {
      const hero = websiteData.hero;
      if (!hero || !hero.content) {
        removeSection("walk");
        return;
      }
      const c = hero.content;
      const sec = getOrCreateSection("walk", "section", "walk-section hero");
      sec.setAttribute("data-json-path", "hero");

          <div class="couple-wrap hero-couple-wrap" id="coupleWrap" data-json-path="hero">
            <div class="ground-shadow" data-json-path="hero"></div>
            ${c.coupleImage ? `<img class="couple hero-image hero-couple-image" id="couple" src="${c.coupleImage}" style="object-position: ${couplePos};" alt="The couple walking" draggable="false" data-json-path="hero.content.coupleImage" />` : ''}
          </div>

    function getActiveTheme() {
      if (!Array.isArray(websiteData.theme)) return null;
      const themes = websiteData.theme.filter(Boolean);
      if (!themes.length) return null;
      return themes.find(theme => theme.id === websiteData.activeTheme) || themes[0];
    }

    function applyThemeFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const themeParam = params.get("theme");
      if (!themeParam || !Array.isArray(websiteData.theme)) return;
      if (websiteData.theme.some(theme => theme && theme.id === themeParam)) {
        websiteData.activeTheme = themeParam;
      }
    }

    function applyActiveTheme() {
      const theme = getActiveTheme();
      if (!theme || !theme.colors) return;
      const root = document.documentElement;
      Object.entries(theme.colors).forEach(([key, value]) => {
        if (value) root.style.setProperty(`--theme-${key.replace(/([A-Z])/g, "-$1").toLowerCase()}`, value);
      });
    }

    /* ==========================================================
     * COMPONENT INITIALIZATIONS
     * ========================================================== */
    let countdownInterval = null;
    let particleAnimationId = null;

    function initializeComponents() {
      initScrollAnimations();
      initHeroParallax();
      initParticles();
      initCountdown();
      initLightbox();
    }

    function initScrollAnimations() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('animating');
            requestAnimationFrame(() => {
              entry.target.classList.add('visible');
              entry.target.classList.remove('animating');
            });
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }

    function initHeroParallax() {
      const section = document.getElementById("walk");
      const far = document.getElementById("farBackground");
      const mid = document.getElementById("midBackground");
      const coupleEl = document.getElementById("coupleWrap");
      const coupleImage = document.getElementById("couple");
      const story = document.getElementById("storyCopy");
      const sun = document.getElementById("sunGlow");
      const hint = document.getElementById("scrollHint");

      if (!section || !far || !mid || !coupleEl) return;

      let targetProgress = 0;
      let currentProgress = 0;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function easeInOut(t) {
        return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      function getProgress() {
        const rect = section.getBoundingClientRect();
        const scrollable = section.offsetHeight - window.innerHeight;
        if (scrollable <= 0) return 0;
        return clamp(-rect.top / scrollable, 0, 1);
      }

      let ticking = false;
      function onScroll() {
        if (!ticking) {
          requestAnimationFrame(() => {
            targetProgress = getProgress();
            ticking = false;
          });
          ticking = true;
        }
      }

      function renderFrame() {
        if (!document.getElementById("walk")) return;

        currentProgress += (targetProgress - currentProgress) * 0.04;
        const p = currentProgress;

        const farX = (p - .5) * -18;
        const farY = p * -20;
        const farScale = 1.08 + p * .06;
        far.style.transform = `translate3d(${farX}px, ${farY}px, 0) scale(${farScale})`;

        const midX = (p - .5) * -38;
        const midY = p * -62;
        const midScale = 1.04 + p * .11;
        mid.style.transform = `translate3d(${midX}px, ${midY}px, 0) scale(${midScale})`;

        const isMobile = window.innerWidth <= 700;
        const cameraP = easeInOut(clamp(p * 1.12, 0, 1));
        const coupleY = cameraP * -8;
        const coupleX = Math.sin(p * Math.PI) * 18;
        const baseScale = 1.0;
        const coupleScale = baseScale + cameraP * 0.26;
        const bob = Math.sin(p * Math.PI * 8) * 2.2 * Math.sin(p * Math.PI);
        const rotate = Math.sin(p * Math.PI * 8) * .35 * Math.sin(p * Math.PI);
        const blurAmt = (1 - cameraP) * .5;

        coupleEl.style.transform = `translate3d(${coupleX}px, ${coupleY + bob}px, 0) scale(${coupleScale}) rotate(${rotate}deg)`;
        coupleImage.style.filter = `blur(${blurAmt}px)`;

        if (story) {
          const textProgress = clamp((p - .52) / .25, 0, 1);
          const textOpacity = easeInOut(textProgress);
          const textY = 35 - textProgress * 35;
          story.style.opacity = textOpacity;
          story.style.transform = `translate3d(-50%, ${textY}px, 0)`;
        }

        if (sun) {
          const textProgress = clamp((p - .52) / .25, 0, 1);
          sun.style.opacity = .10 + textProgress * .18;
        }

        if (hint) {
          hint.style.opacity = p < .08 ? ".78" : "0";
        }

        requestAnimationFrame(renderFrame);
      }

      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll);
      onScroll();
      renderFrame();
    }

    function initParticles() {
      const canvas = document.getElementById('globalParticleCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let particles = [];
      const PARTICLE_COUNT = 48;
      let lastScrollY = window.scrollY;

      function getParticlePalette() {
        const theme = getActiveTheme();
        if (!theme || !theme.colors) return null;
        return {
          core: theme.colors.particleCore,
          edge: theme.colors.particleEdge,
          ember: theme.colors.particleEmber
        };
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function createParticle(randomY = true) {
        const isPetal = Math.random() > 0.25;
        const depth = Math.random();
        const depthScale = 0.5 + depth * 0.85;
        const palette = getParticlePalette();
        if (!palette) return null;

        return {
          type: isPetal ? 'petal' : 'ember',
          x: Math.random() * window.innerWidth,
          y: randomY ? Math.random() * window.innerHeight : -25,
          depth: depthScale,
          length: (4.5 + Math.random() * 6) * depthScale,
          width: (3 + Math.random() * 4.5) * depthScale,
          angle: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.015,
          flipPhase: Math.random() * Math.PI * 2,
          flipSpeed: 0.008 + Math.random() * 0.02,
          fallSpeed: (0.25 + Math.random() * 0.45) * depthScale,
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: 0.005 + Math.random() * 0.012,
          swayAmp: 0.4 + Math.random() * 0.9,
          opacity: (0.25 + Math.random() * 0.45),
          colorCore: palette.core,
          colorEdge: palette.edge,
          emberColor: palette.ember,
          size: (0.7 + Math.random() * 1.1) * depthScale,
          pulse: Math.random() * Math.PI * 2
        };
      }

      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(createParticle(true));
      }

      function drawPetal(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        p.flipPhase += p.flipSpeed;
        ctx.scale(Math.cos(p.flipPhase), 1);
        const l = p.length;
        const w = p.width;

        ctx.beginPath();
        ctx.moveTo(0, -l * 0.5);
        ctx.bezierCurveTo(w * 1.8, -l * 0.25, w * 1.6, l * 0.45, 0, l * 0.5);
        ctx.bezierCurveTo(-w * 1.6, l * 0.45, -w * 1.8, -l * 0.25, 0, -l * 0.5);
        ctx.closePath();

        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, l * 0.55);
        grad.addColorStop(0, p.colorCore + p.opacity + ')');
        grad.addColorStop(0.7, p.colorEdge + (p.opacity * 0.9) + ')');
        grad.addColorStop(1, p.colorEdge + (p.opacity * 0.65) + ')');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();
      }

      function drawEmber(p) {
        ctx.save();
        p.pulse += 0.018;
        const currentOpacity = p.opacity * (0.6 + 0.4 * Math.sin(p.pulse));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.emberColor + currentOpacity + ')';
        ctx.fill();
        ctx.restore();
      }

      if (particleAnimationId) cancelAnimationFrame(particleAnimationId);

      function animate() {
        if (!document.getElementById('globalParticleCanvas')) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const currentScrollY = window.scrollY;
        const scrollDelta = currentScrollY - lastScrollY;
        lastScrollY = currentScrollY;

        particles.forEach((p, idx) => {
          p.y += p.fallSpeed + scrollDelta * p.depth * 0.04;
          p.swayPhase += p.swaySpeed;
          p.x += Math.sin(p.swayPhase) * p.swayAmp;
          p.angle += p.rotationSpeed;

          if (p.type === 'petal') {
            drawPetal(p);
          } else {
            drawEmber(p);
          }

          if (p.y > canvas.height + 35) particles[idx] = createParticle(false);
          else if (p.y < -45) p.y = canvas.height + 25;
          if (p.x < -35) p.x = canvas.width + 25;
          if (p.x > canvas.width + 35) p.x = -25;
        });

        particleAnimationId = requestAnimationFrame(animate);
      }

      resize();
      window.addEventListener('resize', resize);
      animate();
    }

    function initCountdown() {
      if (countdownInterval) clearInterval(countdownInterval);

      const countdown = websiteData.countdown;
      if (!countdown || !countdown.content || !countdown.content.targetDate) return;

      const weddingDate = new Date(countdown.content.targetDate).getTime();
      const daysEl = document.getElementById('cdDays');
      const hoursEl = document.getElementById('cdHours');
      const minutesEl = document.getElementById('cdMinutes');
      const secondsEl = document.getElementById('cdSeconds');

      if (!daysEl || !hoursEl || !minutesEl || !secondsEl) return;

      function padZero(n, length) {
        return String(n).padStart(length, '0');
      }

      function tick() {
        const now = Date.now();
        const diff = Math.max(0, weddingDate - now);

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        const newDays = padZero(days, 3);
        const newHours = padZero(hours, 2);
        const newMins = padZero(minutes, 2);
        const newSecs = padZero(seconds, 2);

        if (daysEl.textContent !== newDays) {
          daysEl.textContent = newDays;
          daysEl.classList.add('tick');
          setTimeout(() => daysEl.classList.remove('tick'), 250);
        }
        if (hoursEl.textContent !== newHours) {
          hoursEl.textContent = newHours;
          hoursEl.classList.add('tick');
          setTimeout(() => hoursEl.classList.remove('tick'), 250);
        }
        if (minutesEl.textContent !== newMins) {
          minutesEl.textContent = newMins;
          minutesEl.classList.add('tick');
          setTimeout(() => minutesEl.classList.remove('tick'), 250);
        }
        if (secondsEl.textContent !== newSecs) {
          secondsEl.textContent = newSecs;
          secondsEl.classList.add('tick');
          setTimeout(() => secondsEl.classList.remove('tick'), 250);
        }
      }

      tick();
      countdownInterval = setInterval(tick, 1000);
    }

    function initLightbox() {
      const galleryCards = document.querySelectorAll('.gallery-card');
      const modal = document.getElementById('lightboxModal');
      const modalImg = document.getElementById('lightboxImg');
      const modalTitle = document.getElementById('lightboxTitle');
      const modalCounter = document.getElementById('lightboxCounter');
      const closeBtn = document.getElementById('lightboxClose');
      const prevBtn = document.getElementById('lightboxPrev');
      const nextBtn = document.getElementById('lightboxNext');

      if (!modal || !modalImg) return;

      const gallery = websiteData.gallery;
      if (!gallery || !gallery.content || !Array.isArray(gallery.content)) return;
      const items = gallery.content;

      let currentIndex = 0;

      function updateLightbox(index) {
        currentIndex = index;
        const item = items[currentIndex];
        if (!item) return;

        modalImg.style.opacity = '0';
        modalImg.style.transform = 'scale(0.96)';

        setTimeout(() => {
          modalImg.src = item.image || '';
          modalImg.alt = item.title || 'Gallery photo';
          if (modalTitle) modalTitle.textContent = item.title || '';
          if (modalCounter) modalCounter.textContent = `${currentIndex + 1} / ${items.length}`;
          modalImg.style.opacity = '1';
          modalImg.style.transform = 'scale(1)';
        }, 150);
      }

      function openLightbox(index) {
        updateLightbox(index);
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
      }

      function nextImage() {
        const newIndex = (currentIndex + 1) % items.length;
        updateLightbox(newIndex);
      }

      function prevImage() {
        const newIndex = (currentIndex - 1 + items.length) % items.length;
        updateLightbox(newIndex);
      }

      galleryCards.forEach(card => {
        card.onclick = () => {
          const idx = parseInt(card.getAttribute('data-index'), 10);
          openLightbox(idx);
        };
      });

      if (closeBtn) closeBtn.onclick = closeLightbox;
      if (prevBtn) prevBtn.onclick = (e) => { e.stopPropagation(); prevImage(); };
      if (nextBtn) nextBtn.onclick = (e) => { e.stopPropagation(); nextImage(); };

      modal.onclick = (e) => {
        if (e.target === modal || e.target.classList.contains('lightbox-content')) {
          closeLightbox();
        }
      };

      document.onkeydown = (e) => {
        if (!modal.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'ArrowRight') nextImage();
      };
    }

    /* ==========================================================
     * PARENT COMMUNICATION & LIVE UPDATES
     * ========================================================== */
    window.addEventListener("message", function (event) {
      if (event.data && event.data.type === "UPDATE_DATA") {
        renderDataAll(event.data.data);
      }
    });

    document.addEventListener("click", function (event) {
      let target = event.target;
      let jsonPath = target.dataset.jsonPath;

      while (!jsonPath && target && target !== document.body) {
        target = target.parentElement;
        if (target) jsonPath = target.dataset.jsonPath;
      }

      if (!jsonPath) return;

      window.parent.postMessage({
        type: "ELEMENT_CLICKED",
        jsonPath: jsonPath
      }, "*");
    });

    /* Initial Render */
    document.addEventListener("DOMContentLoaded", function () {
      applyThemeFromUrl();
      renderDataAll();
    });



  </script>

  <script>
    let scrolling = false;
    let animationFrame = null;

    function stopAutoScroll() {
      if (!scrolling) return;

      scrolling = false;

      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }

      console.log("Auto-scroll stopped by user");
    }

    function scroll() {
      const walkStage = document.querySelector("#walkStage");
      const target = walkStage.scrollHeight * 2.85;

      const duration = 5000;

      const start = window.scrollY;
      const distance = target - start;
      const startTime = performance.now();

      scrolling = true;

      function slowScroll(currentTime) {
        if (!scrolling) return;

        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const eased = progress * (2 - progress);

        window.scrollTo(0, start + distance * eased);

        if (progress < 1) {
          animationFrame = requestAnimationFrame(slowScroll);
        } else {
          scrolling = false;
          animationFrame = null;
        }
      }

      animationFrame = requestAnimationFrame(slowScroll);
    }

    // Stop when the user manually interacts with scrolling
    window.addEventListener("wheel", stopAutoScroll, { passive: true });
    window.addEventListener("touchstart", stopAutoScroll, { passive: true });
    window.addEventListener("touchmove", stopAutoScroll, { passive: true });

    // Keyboard scrolling
    window.addEventListener("keydown", function (e) {
      const keys = [
        "ArrowUp",
        "ArrowDown",
        "PageUp",
        "PageDown",
        "Home",
        "End",
        " "
      ];

      if (keys.includes(e.key)) {
        stopAutoScroll();
      }
    });

    function openWeddingInvitation() {
      const screen = document.getElementById("openingScreen");
      if (!screen || screen.classList.contains("opening")) return;

      screen.classList.add("opening");

      // Let the curtain animation reveal the existing parallax experience first.
      setTimeout(() => {
        screen.classList.add("is-open");
        document.body.style.overflow = "";
        scroll();
      }, 950);

      // Remove the overlay after its fade-out completes.
      setTimeout(() => {
        screen.remove();
      }, 1900);
    }


  </script>
